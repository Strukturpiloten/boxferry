[package]
name = "boxferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Library and CLI for converting container definitions with compatibility diagnostics"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "boxferry"
path = "src/main.rs"
required-features = ["cli", "compose", "quadlet"]

[[test]]
name = "quadlet_to_compose"
required-features = ["compose", "quadlet"]

[dependencies]
boxferry-compose = { path = "../boxferry-compose", version = "0.6.0", optional = true }
boxferry-engine = { path = "../boxferry-engine", version = "0.6.0" }
boxferry-model = { path = "../boxferry-model", version = "0.6.0" }
boxferry-quadlet = { path = "../boxferry-quadlet", version = "0.6.0", optional = true }
clap = { version = "4.6.5", features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
zip = { version = "6.0.0", default-features = false, optional = true }

[dependencies.jiff]
version = "=0.2.24"
default-features = false
features = ["std", "tz-system"]
optional = true

[dev-dependencies]
toml = "1.1.4"

[features]
default = ["cli", "compose", "quadlet"]
cli = ["dep:clap", "dep:jiff", "dep:serde", "dep:serde_json", "dep:zip"]
compose = ["dep:boxferry-compose"]
quadlet = ["dep:boxferry-quadlet"]

[lints]
workspace = true
