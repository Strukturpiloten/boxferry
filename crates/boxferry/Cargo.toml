[package]
name = "boxferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Open-source CLI and Rust library for source-aware conversion between Docker Compose, Podman, and Quadlet"
documentation = "https://docs.rs/boxferry"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "boxferry"
path = "src/main.rs"
required-features = ["cli", "compose", "podman", "quadlet"]

[[test]]
name = "quadlet_to_compose"
required-features = ["compose", "quadlet"]

[dependencies]
boxferry-compose = { path = "../boxferry-compose", version = "0.8.3", optional = true }
boxferry-engine = { path = "../boxferry-engine", version = "0.8.3" }
boxferry-model = { path = "../boxferry-model", version = "0.8.3" }
boxferry-podman = { path = "../boxferry-podman", version = "0.8.3", optional = true }
boxferry-quadlet = { path = "../boxferry-quadlet", version = "0.8.3", optional = true }
clap = { version = "4.6.5", features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[dependencies.jiff]
version = "=0.2.35"
default-features = false
features = ["std", "tz-system"]
optional = true

[dependencies.tokio]
version = "1.53.1"
features = ["macros", "rt"]
optional = true

[dev-dependencies]
serde_json = "1.0.151"
toml = "=1.1.4"

[features]
default = ["cli", "compose", "podman", "quadlet"]
cli = ["dep:clap", "dep:jiff", "dep:serde", "dep:serde_json", "dep:tokio", "dep:zip"]
compose = ["dep:boxferry-compose"]
quadlet = ["dep:boxferry-quadlet"]
podman = ["dep:boxferry-podman"]

[lints]
workspace = true
