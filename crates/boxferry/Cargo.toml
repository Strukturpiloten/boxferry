[package]
name = "boxferry"
description = "Library and CLI for converting container definitions with compatibility diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = []
compose = ["dep:boxferry-compose"]
quadlet = ["dep:boxferry-quadlet"]

[dependencies]
boxferry-compose = { path = "../boxferry-compose", version = "0.1.0", optional = true }
boxferry-engine = { path = "../boxferry-engine", version = "0.1.0" }
boxferry-model = { path = "../boxferry-model", version = "0.1.0" }
boxferry-quadlet = { path = "../boxferry-quadlet", version = "0.1.0", optional = true }

[dev-dependencies]
toml = "1.1.4"

[lints]
workspace = true
