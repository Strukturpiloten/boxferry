[package]
name = "boxferry"
description = "Library and CLI for converting container definitions with compatibility diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
default = ["cli", "compose", "quadlet"]
cli = ["dep:clap"]
compose = ["dep:boxferry-compose"]
quadlet = ["dep:boxferry-quadlet"]
runtime = ["dep:boxferry-runtime"]
podman-runtime = ["runtime", "dep:boxferry-podman"]
docker-runtime = ["runtime", "dep:boxferry-docker"]

[dependencies]
boxferry-compose = { path = "../boxferry-compose", version = "0.1.0", optional = true }
boxferry-docker = { path = "../boxferry-docker", version = "0.1.0", optional = true }
boxferry-engine = { path = "../boxferry-engine", version = "0.1.0" }
boxferry-model = { path = "../boxferry-model", version = "0.1.0" }
boxferry-quadlet = { path = "../boxferry-quadlet", version = "0.1.0", optional = true }
boxferry-podman = { path = "../boxferry-podman", version = "0.1.0", optional = true }
boxferry-runtime = { path = "../boxferry-runtime", version = "0.1.0", optional = true }
clap = { version = "4.6.5", features = ["derive"], optional = true }

[dev-dependencies]
toml = "1.1.4"

[lints]
workspace = true

[[bin]]
name = "boxferry"
path = "src/main.rs"
required-features = ["cli", "compose", "quadlet"]
