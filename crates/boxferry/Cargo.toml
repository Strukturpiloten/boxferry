[package]
name = "boxferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Library and CLI for converting container definitions with compatibility diagnostics"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "boxferry"
path = "src/main.rs"
required-features = ["cli", "compose", "quadlet"]

[[test]]
name = "quadlet_to_compose"
required-features = ["compose", "quadlet"]

[dependencies]
boxferry-compose = {
  path = "../boxferry-compose",
  version = "0.1.1",
  optional = true
}
boxferry-docker = {
  path = "../boxferry-docker",
  version = "0.1.1",
  optional = true
}
boxferry-engine = { path = "../boxferry-engine", version = "0.1.1" }
boxferry-model = { path = "../boxferry-model", version = "0.1.1" }
boxferry-podman = {
  path = "../boxferry-podman",
  version = "0.1.1",
  optional = true
}
boxferry-quadlet = {
  path = "../boxferry-quadlet",
  version = "0.1.1",
  optional = true
}
boxferry-runtime = {
  path = "../boxferry-runtime",
  version = "0.1.1",
  optional = true
}
clap = { version = "4.6.5", features = ["derive"], optional = true }

[dev-dependencies]
toml = "1.1.4"

[features]
default = ["cli", "compose", "quadlet"]
cli = ["dep:clap"]
compose = ["dep:boxferry-compose"]
docker-runtime = ["dep:boxferry-docker", "runtime"]
podman-runtime = ["dep:boxferry-podman", "runtime"]
quadlet = ["dep:boxferry-quadlet"]
runtime = ["dep:boxferry-runtime"]

[lints]
workspace = true
