[package]
name = "boxferry-podman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
description = "PodmanLens adapter for importing and rendering Podman resources with BoxFerry"
documentation = "https://docs.rs/boxferry-podman"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
boxferry-engine = { path = "../boxferry-engine", version = "0.9.1" }
boxferry-model = { path = "../boxferry-model", version = "0.9.1" }
podman-lens = { version = "0.2.4", default-features = false }
serde_json = "1"

[dev-dependencies]
futures = "=0.3.34"
# Cargo resolves this exact development constraint together with yoke's
# transitive proc-macro dependency, keeping Rust 1.85 compatible. Remove it
# after an upstream yoke-derive release newer than 0.8.3 passes the MSRV gate.
yoke-derive = "=0.8.2"

[lints]
workspace = true
