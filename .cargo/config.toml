[alias]
ci-check = "check --locked --workspace --all-targets --all-features"
ci-clippy = "clippy --locked --workspace --all-targets --all-features -- -D warnings"
ci-compose = "check --locked --package boxferry --all-targets --no-default-features --features compose"
ci-core = "check --locked --package boxferry --all-targets --no-default-features"
ci-docker = "check --locked --package boxferry --all-targets --no-default-features --features docker-runtime"
ci-docker-conformance = "test --locked --package boxferry-docker --test conformance -- --ignored --nocapture current_docker_engine_decodes_reviewed_api_responses"
ci-doc = "doc --locked --workspace --all-features --no-deps"
ci-doctest = "test --locked --doc --workspace --all-features"
ci-policy = "test --locked --package boxferry --test repository_policy"
ci-quadlet = "check --locked --package boxferry --all-targets --no-default-features --features quadlet"
ci-real-world-compose = "test --locked --package boxferry --test real_world_compose -- --ignored --nocapture"
ci-podman = "check --locked --package boxferry --all-targets --no-default-features --features podman-runtime"
ci-podman-conformance = "test --locked --package boxferry-podman --test conformance -- --ignored --nocapture available_podman_minor_lines_decode_live_inspection"
ci-podman-current-conformance = "test --locked --package boxferry-podman --test conformance -- --ignored --nocapture installed_current_podman_decodes_live_inspection"
ci-runtime = "check --locked --package boxferry --all-targets --no-default-features --features runtime"
ci-test = "test --locked --workspace --all-targets --all-features"
