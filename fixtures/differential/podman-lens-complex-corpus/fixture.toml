license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "Offline deterministic request replay only; no Podman daemon, process environment, host identity, credentials, or network access is used. Execution context comes from each cassette."

[expectations]
summary = "All fourteen artifacts retain their reviewed hashes and provenance, replay exactly thirty read-only Libpod interactions, import through the neutral Application model, and exercise every registered exporter."

