---
_format_version: "3.0"
_transform: true

services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth
        paths: [/auth/v1]
        strip_path: true

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest
        paths: [/rest/v1]
        strip_path: true

  - name: realtime
    url: http://realtime-dev.supabase-realtime:4000/socket
    routes:
      - name: realtime
        paths: [/realtime/v1]
        strip_path: true

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage
        paths: [/storage/v1]
        strip_path: true

  - name: functions
    url: http://functions:9000
    routes:
      - name: functions
        paths: [/functions/v1]
        strip_path: true

  - name: meta
    url: http://meta:8080
    routes:
      - name: meta
        paths: [/pg]
        strip_path: true

  - name: studio
    url: http://studio:3000
    routes:
      - name: studio
        paths: [/studio]
        strip_path: true
