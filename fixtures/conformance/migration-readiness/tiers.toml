schema = 1
evidence-schema = "docs/schemas/migration-readiness-evidence-v1.schema.json"

[[gaps]]
id = "observability-stack"
state = "planned"
reason = "Prometheus, Grafana, and Loki application behavior is tracked by BoxFerry issue #139 and is not current migration evidence."

[[gaps]]
id = "supabase-runtime"
state = "planned"
reason = "Supabase runtime behavior is tracked by BoxFerry issue #140; its offline source fixture is not a successful runtime migration."

[[gaps]]
id = "gpu"
state = "not-executed"
reason = "GPU acceleration and Immich machine-learning inference are outside the CPU-only reviewed application contract."

[[gaps]]
id = "virtual-machine"
state = "not-executed"
reason = "No virtual-machine lane is admitted; all live evidence comes from bounded disposable containers on one Linux host."

[[gaps]]
id = "selinux-enforcing-runtime"
state = "not-executed"
reason = "SELinux mount intent is checked, but no enforcing-host runtime effect is claimed."

[[gaps]]
id = "booted-systemd"
state = "not-executed"
reason = "Pinned Quadlet generators are exercised without booting systemd or starting generated units."

[[tiers]]
id = "offline"
description = "Deterministic authored applications and captured Podman inventories through every importer and exporter contract."
max-concurrency = 1
tier-deadline-seconds = 1200
manual-prerequisites = []
tasks = ["offline-application-contracts"]

[[tiers]]
id = "trusted-live"
description = "Small trusted rootful/rootless Podman API boundary and genuine Forgejo migration set."
max-concurrency = 1
tier-deadline-seconds = 2700
manual-prerequisites = [
  "Linux amd64",
  "root privileges",
  "Podman",
  "network access for digest-pinned reviewed images",
  "BOXFERRY_BIN naming a freshly built binary",
  "BOXFERRY_COMPOSE_BIN naming Docker Compose 5.5.0 with the reviewed SHA-256",
]
tasks = [
  "podman-api-5.4-rootless",
  "podman-api-6.1-rootful",
  "podman-api-6.1-rootless",
  "forgejo-root-modes",
]

[[tiers]]
id = "pre-release"
description = "Exact-revision release evidence: offline contracts, complete reviewed Podman matrix, expensive applications, and candidate Lens consumers."
max-concurrency = 1
tier-deadline-seconds = 19800
manual-prerequisites = [
  "all trusted-live prerequisites",
  "at least 8 GiB available RAM",
  "at least 12 GiB free temporary and Podman graph-root space",
  "Git network access to the exact reviewed Lens revisions",
]
tasks = [
  "offline-application-contracts",
  "podman-complete-matrix",
  "nextcloud-application",
  "forgejo-root-modes",
  "paperless-application",
  "immich-application",
  "compose-lens-candidate",
  "quadlet-lens-candidate",
]

[[tasks]]
id = "offline-application-contracts"
kind = "command"
privileged = false
workload = "reviewed-scenario-catalogue"
sources = ["compose", "podman-cassette", "quadlet"]
targets = ["compose-specification", "podman-5.4.0..6.1.0", "quadlet-5.4.0..6.1.0"]
approved-losses = "Each scenario.toml evidence row and its exact expected.*.losses.tsv file."
runtime-claim = "not-applicable"
deadline-seconds = 900
minimum-memory-mib = 2048
minimum-disk-mib = 4096
maximum-rss-mib = 4096
maximum-disk-growth-mib = 4096
required-tools = ["cargo", "git"]
command = [
  "cargo",
  "test",
  "--locked",
  "--package",
  "boxferry",
  "--test",
  "scenario_contract",
  "authored_scenarios_execute_every_exporter_and_record_independent_evidence",
  "--",
  "--exact",
  "--nocapture",
]

