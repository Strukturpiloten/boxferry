---
services:
  db:
    image: ${BF_POSTGRES_IMAGE:?}
    pull_policy: never
    container_name: ${BF_PREFIX}-forge-db
    labels: &application-labels
      io.boxferry.live-run: ${BF_RUN:?}
      io.boxferry.application: ${BF_PREFIX}-forgejo
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${BF_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      backend:
        aliases: [db]
    volumes:
      - db:/var/lib/postgresql/data

  forgejo:
    image: ${BF_FORGEJO_IMAGE:?}
    pull_policy: never
    container_name: ${BF_PREFIX}-forge-app
    labels: *application-labels
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${BF_DB_PASSWORD:?}
      FORGEJO__database__SSL_MODE: disable
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${BF_FORGEJO_SECRET_KEY:?}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__ROOT_URL: http://127.0.0.1:13000/
      FORGEJO__server__SSH_DOMAIN: 127.0.0.1
      FORGEJO__server__SSH_PORT: "12222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__server__START_SSH_SERVER: "true"
    ports:
      - "127.0.0.1:13000:3000"
      - "127.0.0.1:12222:2222"
    networks:
      backend:
        aliases: [forgejo]
      edge:
        aliases: [forgejo]
    volumes:
      - data:/var/lib/gitea

networks:
  backend:
    name: ${BF_PREFIX}-forge-backend
    internal: true
    labels: *application-labels
  edge:
    name: ${BF_PREFIX}-shared-edge
    external: true

volumes:
  db:
    name: ${BF_PREFIX}-forge-db
    labels: *application-labels
  data:
    name: ${BF_PREFIX}-forge-data
    labels: *application-labels
