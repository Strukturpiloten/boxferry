schema = 1
id = "docker-inspect-api-1-40"
suite = "runtime"
description = "Protects the reviewed Docker Engine API 1.40 inspect boundary and representative resource relationships."
secrets_reviewed = true
files = [
  "containers.json",
  "images.json",
  "networks.json",
  "volumes.json",
]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "Sanitized minimal JSON models documented Docker Engine API 1.40 inspect fields; no daemon or credentials are required."

[expectations]
summary = "Image defaults, effective command/environment/metadata/user/working-directory/read-only-root and retry-limited restart state, tag-plus-digest image names, ports, SELinux mounts, aliases, and finite relationships decode without exposing raw runtime identities."

[extensions.docker]
api-version = "1.40"
source-review = "Docker Engine API version-history schema for v1.40 and container, image, network, and volume inspect references"
