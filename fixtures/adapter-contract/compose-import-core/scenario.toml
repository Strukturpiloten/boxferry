diagnostics = [
  "BFP0007|services.web.environment.EMPTY",
  "BFP0007|services.web.environment.FROM_HOST",
  "BFP0007|services.web.environment.OVERRIDE_ONLY",
  "BFP0007|services.web.environment.PORT",
  "BFP0007|services.web.restart_policy",
  "BFP0007|services.web.mounts[1].source",
  "BFP0007|services.web.mounts[1].selinux_relabel",
  "BFP0007|services.web.mounts[2].source",
  "BFP0007|services.web.mounts[2].selinux_relabel",
