]
podman-plan = { creatable-resources = ["secret:local-password", "container:web"], external-preconditions = ["secret:api-token", "secret:certificate", "secret:database-password"], image-operations = [{ resource = "web-image", reference = "example.invalid/web:1", policy = "missing" }], start-order = ["web"] }
allowed-losses = [
  { rule = "BFP0007", subject = "secrets.api-token.runtime_name", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
  { rule = "BFP0007", subject = "services.web.config_grants", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
