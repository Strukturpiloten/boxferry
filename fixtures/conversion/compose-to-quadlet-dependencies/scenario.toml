schema = 1
id = "compose-to-quadlet-dependencies"
source-capabilities = ["compose"]
target-capabilities = ["compose", "podman", "quadlet"]

[application]
name = "dependency-demo"
version = "1.0.0"

[[components]]
name = "database"
version = "1.0.0"
image = "example.invalid/database"
digest = "sha256:1111111111111111111111111111111111111111111111111111111111111111"
configured-image = "example.invalid/database:1"

[[components]]
name = "cache"
version = "1.0.0"
image = "example.invalid/cache"
digest = "sha256:2222222222222222222222222222222222222222222222222222222222222222"
configured-image = "example.invalid/cache:1"

[[components]]
name = "web"
version = "1.0.0"
image = "example.invalid/web"
digest = "sha256:3333333333333333333333333333333333333333333333333333333333333333"
configured-image = "example.invalid/web:1"

[[native-inputs]]
id = "compose"
importer = "compose"
files = ["compose.yaml"]
format-version = "compose-specification"

[provenance]
source = "authored"
license = "MPL-2.0"
privacy-reviewed = true
test-data = "Repository-authored synthetic dependency graph and health command; no captured user data or credentials."
image-evidence = "Synthetic example.invalid image identities are never pulled; digest-shaped metadata is offline-only."

[deployment]
origin = "authored"
root-mode = "not-applicable"

[semantics]
selected-resources = ["service:cache", "service:database", "service:web"]
excluded-resources = []
ownership-boundaries = []
shared-boundaries = []
required-mounts = []
required-environment = []
required-dependencies = [
  { service = "web", dependency = "database", condition = "healthy" },
  { service = "web", dependency = "cache", condition = "unspecified", required = false },
]
required-healthchecks = [
  { service = "database", command-kind = "exec", command = ["true"] },
]
required-ports = []
required-restart = ["cache:absent", "database:absent", "web:absent"]
unpublished-services = ["cache", "database", "web"]
external-prerequisites = []
expected-diagnostics = []

[[evidence]]
input = "compose"
exporter = "compose"
target-implementation = "compose-specification"
target-minimum = "1.0.0"
target-maximum = "1.0.0"
loss-policy = "partial"
outcome = "known-migration-gap"
reason = "ComposeLens 0.3.0 output cannot encode the independently asserted healthcheck and dependency options."
artifacts = ["compose.yaml"]
native-validation = { state = "passed" }
runtime-probe = { state = "not-applicable", reason = "Offline authored fixture; no runtime operation is claimed." }
reimport = { state = "known-migration-gap", reason = "Generated Compose cannot reconstruct the reviewed semantic gaps." }
diagnostics = [
  "BFC0007|services.database.healthcheck",
  "BFC0007|services.web.dependencies[0]",
  "BFC0007|services.web.dependencies[1]",
]
semantic-gaps = ["dependency:web:cache", "dependency:web:database", "healthcheck:database"]
reimport-semantic-gaps = ["dependency:web:cache", "dependency:web:database", "healthcheck:database"]
allowed-losses = [
  { rule = "BFC0007", subject = "services.database.healthcheck", decision = "unsupported", version-scope = "compose-specification@1.0.0..1.0.0" },
  { rule = "BFC0007", subject = "services.web.dependencies[0]", decision = "unsupported", version-scope = "compose-specification@1.0.0..1.0.0" },
  { rule = "BFC0007", subject = "services.web.dependencies[1]", decision = "unsupported", version-scope = "compose-specification@1.0.0..1.0.0" },
]

[[evidence]]
input = "compose"
exporter = "quadlet"
target-implementation = "podman"
target-minimum = "5.4.0"
target-maximum = "6.1.0"
loss-policy = "exact"
outcome = "known-migration-gap"
reason = "Generated Quadlet preserves the dependency relationships, but QuadletLens 0.2.3 cannot reimport them from systemd unit relationships."
artifacts = ["cache.container", "database.container", "web.container"]
native-validation = { state = "passed" }
runtime-probe = { state = "not-applicable", reason = "Offline authored fixture; no runtime operation is claimed." }
reimport = { state = "known-migration-gap", reason = "QuadletLens 0.2.3 cannot reimport service dependencies from generated systemd unit relationships." }
reimport-semantic-gaps = ["dependency:web:cache", "dependency:web:database"]

[[evidence]]
input = "compose"
exporter = "podman"
target-implementation = "podman"
target-minimum = "5.4.0"
target-maximum = "6.1.0"
loss-policy = "partial"
outcome = "known-migration-gap"
reason = "Podman deployment output cannot encode the independently asserted healthcheck and dependency options."
artifacts = ["podman-commands.sh", "podman.json"]
native-validation = { state = "passed" }
runtime-probe = { state = "not-applicable", reason = "Offline authored fixture; no runtime operation is claimed." }
reimport = { state = "not-applicable", reason = "Deployment plans are not observed Podman inventories." }
diagnostics = [
  "BFP0007|services.database.healthcheck",
  "BFP0007|services.web.dependencies[0].options",
  "BFP0007|services.web.dependencies[1].options",
]
semantic-gaps = ["dependency:web:cache", "dependency:web:database", "healthcheck:database"]
allowed-losses = [
  { rule = "BFP0007", subject = "services.database.healthcheck", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
  { rule = "BFP0007", subject = "services.web.dependencies[0].options", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
  { rule = "BFP0007", subject = "services.web.dependencies[1].options", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
]
