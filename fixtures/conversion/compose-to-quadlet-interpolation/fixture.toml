schema = 1
id = "compose-to-quadlet-interpolation"
suite = "conversion"
description = "Protects opt-in Compose interpolation from explicit plain and individually authorized sensitive process variables."
secrets_reviewed = true
files = ["compose.yaml", "app.container", "expected-matrix-compose.yaml", "expected-podman.json", "expected-podman-commands.sh"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "Interpolation is explicitly enabled; TAG=2.1 is plain, TOKEN is read by name as sensitive, and an unauthorized ambient UNAUTHORIZED value must not be captured."

[expectations]
summary = "Only caller-authorized values enter interpolation; Compose defaults use an empty explicit environment rather than ambient state, and restart no converts exactly to systemd Restart=no."

[extensions.compose]
source-ids = [96]
active-profiles = []
interpolation = "explicit-only"

[extensions.quadlet]
podman-minimum-version = "5.4.0"
podman-maximum-version = "6.0.2"
grouping-policy = "separate-containers"

[[extensions.scenarios]]
id = "compose"
input = "compose"
sources = ["compose.yaml"]
interpolate = true
environment = ["TAG=2.1", "TOKEN=explicit-secret"]
protected-values = ["explicit-secret"]

[extensions.scenarios.exports.compose]
loss-policy = "exact"
artifact-values = ["explicit-secret"]

[[extensions.scenarios.exports.compose.artifacts]]
artifact = "compose.yaml"
expected = "expected-matrix-compose.yaml"

[extensions.scenarios.exports.quadlet]
loss-policy = "exact"
podman-minimum = "5.4.0"
podman-maximum = "6.0.2"
artifact-values = ["explicit-secret"]

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "app.container"
expected = "app.container"

[extensions.scenarios.exports.podman]
loss-policy = "partial"
diagnostic-codes = ["BFP0007", "BFP0007"]

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman-commands.sh"
expected = "expected-podman-commands.sh"

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman.json"
expected = "expected-podman.json"
