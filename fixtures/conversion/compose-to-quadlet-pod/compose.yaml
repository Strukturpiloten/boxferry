---
name: ferry-pod
services:
  web:
    image: example.invalid/web:1
    userns_mode: keep-id
    extra_hosts:
      - host.docker.internal=host-gateway
    ports:
      - "8080:80/tcp"
      - "8081"
    networks:
      - frontend
  worker:
    image: example.invalid/worker:1
    userns_mode: keep-id
    depends_on:
      - web
    extra_hosts:
      - host.docker.internal=host-gateway
    ports:
      - "9090:90/tcp"
      - target: 9091
        protocol: udp
    networks:
      - frontend
networks:
  frontend:
