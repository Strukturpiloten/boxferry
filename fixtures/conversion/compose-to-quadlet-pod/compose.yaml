name: ferry-pod
services:
  web:
    image: example.invalid/web:1
    extra_hosts:
      - host.docker.internal=host-gateway
    ports:
      - "8080:80/tcp"
    networks:
      - frontend
  worker:
    image: example.invalid/worker:1
    depends_on:
      - web
    extra_hosts:
      - host.docker.internal=host-gateway
    ports:
      - "9090:90/tcp"
    networks:
      - frontend
networks:
  frontend:
