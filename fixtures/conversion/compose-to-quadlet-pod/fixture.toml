schema = 1
id = "compose-to-quadlet-pod"
suite = "conversion"
description = "Protects explicit compatible Compose-to-Quadlet single-pod conversion with a shared user namespace, host mappings, and service ordering."
secrets_reviewed = true
files = [
  "compose.yaml",
  "frontend.network",
  "ferry-pod.pod",
  "web.container",
  "worker.container",
  "expected-matrix-compose.yaml",
]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "No Compose profiles are active; explicit single-pod grouping targets Podman 5.4.0 through 6.0.2 and requires AllowApproximate."

[expectations]
summary = "Compatible services share one generated pod only by caller request; their identical user namespace and host mappings plus ports and networks move to pod scope, while a short Compose dependency remains a systemd Requires/After relationship between generated container services."

[extensions.compose]
source-ids = [93]
active-profiles = []

[extensions.quadlet]
podman-minimum-version = "5.4.0"
podman-maximum-version = "6.0.2"
grouping-policy = "single-pod"

[[extensions.scenarios]]
id = "compose"
input = "compose"
sources = ["compose.yaml"]

[extensions.scenarios.exports.compose]
loss-policy = "partial"
diagnostic-codes = ["BFC0007", "BFC0009", "BFC0009", "BFC0009", "BFC0009"]
fixed-diagnostic-codes = ["BFC0009", "BFC0009", "BFC0009", "BFC0009"]

[[extensions.scenarios.exports.compose.artifacts]]
artifact = "compose.yaml"
expected = "expected-matrix-compose.yaml"

[extensions.scenarios.exports.quadlet]
loss-policy = "approximate"
diagnostic-codes = ["BFQ0007"]
grouping = "pod"
pod-name = "ferry-pod"
podman-minimum = "5.4.0"
podman-maximum = "6.0.2"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "frontend.network"
expected = "frontend.network"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "ferry-pod.pod"
expected = "ferry-pod.pod"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "web.container"
expected = "web.container"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "worker.container"
expected = "worker.container"
