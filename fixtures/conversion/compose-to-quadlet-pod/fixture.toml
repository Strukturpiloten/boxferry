schema = 1
id = "compose-to-quadlet-pod"
suite = "conversion"
description = "Protects explicit compatible Compose-to-Quadlet single-pod conversion with shared host mappings and service ordering."
secrets_reviewed = true
files = [
  "compose.yaml",
  "frontend.network",
  "ferry-pod.pod",
  "web.container",
  "worker.container",
]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "No Compose profiles are active; explicit single-pod grouping targets Podman 5.4.0 through 6.0.2 and requires AllowApproximate."

[expectations]
summary = "Compatible services share one generated pod only by caller request; identical host mappings, ports, and networks move to pod scope, while a short Compose dependency remains a systemd Requires/After relationship between generated container services."

[extensions.compose]
source-ids = [93]
active-profiles = []

[extensions.quadlet]
podman-minimum-version = "5.4.0"
podman-maximum-version = "6.0.2"
grouping-policy = "single-pod"
