schema = 1
id = "compose-to-quadlet-core"
suite = "conversion"
description = "Protects the first policy-controlled Compose-to-Quadlet multi-file conversion, including execution context, health checks, service labels, and explicit host mappings."
secrets_reviewed = true
files = [
  "compose.yaml",
  "compose.override.yaml",
  "frontend.network",
  "data.volume",
  "web.container",
  "expected-diagnostics.txt",
  "expected-matrix-compose.txt",
  "expected-matrix-web.container",
  "expected-podman.json",
  "expected-podman-commands.sh",
]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The empty Compose profile selection excludes worker; Podman target is 5.4.0 through 6.0.2; no host environment or relative-path base is supplied."

[expectations]
summary = "Supported execution-context, health-check, service-label, host-mapping, and single-network alias intent produces three validated Quadlet files; start_interval, host environment resolution, and relative bind sources require AllowPartial and stable diagnostics."

[extensions.compose]
source-ids = [91, 92]
active-profiles = []

[extensions.quadlet]
podman-minimum-version = "5.4.0"
podman-maximum-version = "6.0.2"

[[extensions.scenarios]]
id = "compose"
input = "compose"
sources = ["compose.yaml", "compose.override.yaml"]
protected-values = [
  "{\"channel\": \"stable\"}",
  "literal%h",
]

[extensions.scenarios.exports.compose]
loss-policy = "partial"
diagnostic-codes = ["BFC0007", "BFC0007", "BFC0009", "BFC0009"]
fixed-diagnostic-codes = ["BFC0009", "BFC0009"]
artifact-values = ["{\\\"channel\\\": \\\"stable\\\"}", "literal%h"]

[[extensions.scenarios.exports.compose.artifacts]]
artifact = "compose.yaml"
expected = "expected-matrix-compose.txt"

[extensions.scenarios.exports.quadlet]
loss-policy = "partial"
diagnostic-codes = ["BFQ0003", "BFQ0003"]
normalize-project-root = true
podman-minimum = "5.4.0"
podman-maximum = "6.0.2"
artifact-values = ["{\\\"channel\\\": \\\"stable\\\"}", "literal%%h"]

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "frontend.network"
expected = "frontend.network"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "data.volume"
expected = "data.volume"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "web.container"
expected = "expected-matrix-web.container"

[extensions.scenarios.exports.podman]
loss-policy = "partial"
diagnostic-codes = [
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
  "BFP0007",
]
artifact-values = ["{\"channel\": \"stable\"}", "literal%h"]

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman-commands.sh"
expected = "expected-podman-commands.sh"

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman.json"
expected = "expected-podman.json"
