---
name: ferry-demo
services:
  web:
    container_name: ferry-web-base
    image: registry.example:5000/team/web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command: ["php", "-v"]
    user: 1001:1002
    userns_mode: keep-id
    group_add:
      - audio
      - "44"
    working_dir: /srv/app
    read_only: true
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    environment:
      EMPTY: ""
      FROM_HOST:
      PORT: 8080
    labels:
      com.example.empty:
      com.example.metadata: '{"channel": "stable"}'
      com.example.literal-specifier: literal%h
    extra_hosts:
      - host.docker.internal=host-gateway
      - ipv6=[::1]
    ports:
      - "127.0.0.1:8080:80/tcp"
      - target: 8443
        published: 8443
        protocol: tcp
    volumes:
      - data:/var/lib/data:ro
      - "./config:/etc/app:Z,ro"
      - type: bind
        source: ./shared
        target: /srv/shared
        bind:
          selinux: z
    networks:
      frontend:
        aliases:
          - web.local
  worker:
    image: registry.example/team/worker:1
    profiles:
      - worker
volumes:
  data:
networks:
  frontend:
