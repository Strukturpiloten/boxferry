schema = 1
id = "document-route-matrix"
suite = "conversion"
description = "Defines the exact deterministic two-by-two Compose and Quadlet neutral-model route boundary."
secrets_reviewed = true
files = [
  "compose-interpolation.yaml",
  "compose-required.yaml",
  "compose-unresolved.yaml",
  "compose.yaml",
  "expected-compose-neutral.yaml",
  "expected-compose-interpolated.yaml",
  "expected-interpolated-web.container",
  "expected-web.container",
  "invalid.container",
  "variables.env",
  "web.container",
]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "No host environment, project directory, runtime, or external process input is used."

[expectations]
summary = "Each Compose/Quadlet input-output pair passes through the neutral application model and has an exact reviewed result, while documentation variants cover explicit interpolation plus malformed and unresolved input without using ambient values."
