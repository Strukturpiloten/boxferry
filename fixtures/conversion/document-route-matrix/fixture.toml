schema = 1
id = "document-route-matrix"
suite = "conversion"
description = "Defines the deterministic two-input, three-output Compose, Quadlet, and terminal Podman neutral-model route boundary."
secrets_reviewed = true
files = [
  "compose-interpolation.yaml",
  "compose-required.yaml",
  "compose-unresolved.yaml",
  "compose.yaml",
  "expected-compose-neutral.yaml",
  "expected-compose-interpolated.yaml",
  "expected-interpolated-web.container",
  "expected-lossy-compose-after-quadlet.yaml",
  "expected-lossy-web.container",
  "lossy-compose.yaml",
  "expected-web.container",
  "invalid.container",
  "variables.env",
  "web.container",
  "tmpfs-compose.yaml",
  "expected-tmpfs-compose.yaml",
  "expected-tmpfs-worker.container",
  "expected-tmpfs-podman.json",
  "expected-tmpfs-podman-commands.sh",
  "expected-podman.json",
  "expected-podman-commands.sh",
  "expected-lossy-podman.json",
  "expected-lossy-podman-commands.sh",
]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "No host environment, project directory, runtime, or external process input is used."

[expectations]
summary = "Each Compose/Quadlet input-output pair passes through the neutral application model and has an exact reviewed result; a realistic lossy Compose chain protects generated quoted assignments, while documentation variants cover explicit interpolation plus malformed and unresolved input without using ambient values."

[extensions.matrix.inputs.compose]
sources = ["compose.yaml"]

[[extensions.matrix.inputs.compose.exports.compose]]
artifact = "compose.yaml"
expected = "expected-compose-neutral.yaml"

[[extensions.matrix.inputs.compose.exports.quadlet]]
artifact = "web.container"
expected = "expected-web.container"

[[extensions.matrix.inputs.compose.exports.podman]]
artifact = "podman-commands.sh"
expected = "expected-podman-commands.sh"

[[extensions.matrix.inputs.compose.exports.podman]]
artifact = "podman.json"
expected = "expected-podman.json"

[extensions.matrix.inputs.quadlet]
sources = ["web.container"]
application-name = "route-matrix"

[[extensions.matrix.inputs.quadlet.exports.compose]]
artifact = "compose.yaml"
expected = "expected-compose-neutral.yaml"

[[extensions.matrix.inputs.quadlet.exports.quadlet]]
artifact = "web.container"
expected = "expected-web.container"

[[extensions.matrix.inputs.quadlet.exports.podman]]
artifact = "podman-commands.sh"
expected = "expected-podman-commands.sh"

[[extensions.matrix.inputs.quadlet.exports.podman]]
artifact = "podman.json"
expected = "expected-podman.json"

[[extensions.scenarios]]
id = "normal-compose"
input = "compose"
sources = ["compose.yaml"]

[extensions.scenarios.exports.compose]
loss-policy = "exact"

[[extensions.scenarios.exports.compose.artifacts]]
artifact = "compose.yaml"
expected = "expected-compose-neutral.yaml"

[extensions.scenarios.exports.quadlet]
loss-policy = "exact"
podman-minimum = "5.4.0"
podman-maximum = "6.0.2"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "web.container"
expected = "expected-web.container"

[extensions.scenarios.exports.podman]
loss-policy = "partial"
diagnostic-codes = ["BFP0007"]

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman-commands.sh"
expected = "expected-podman-commands.sh"

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman.json"
expected = "expected-podman.json"

[[extensions.scenarios]]
id = "normal-quadlet"
input = "quadlet"
sources = ["web.container"]
application-name = "route-matrix"

[extensions.scenarios.exports.compose]
loss-policy = "exact"

[[extensions.scenarios.exports.compose.artifacts]]
artifact = "compose.yaml"
expected = "expected-compose-neutral.yaml"

[extensions.scenarios.exports.quadlet]
loss-policy = "exact"
podman-minimum = "5.4.0"
podman-maximum = "6.0.2"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "web.container"
expected = "expected-web.container"

[extensions.scenarios.exports.podman]
loss-policy = "partial"
diagnostic-codes = ["BFP0007"]

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman-commands.sh"
expected = "expected-podman-commands.sh"

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman.json"
expected = "expected-podman.json"

[[extensions.scenarios]]
id = "lossy-compose"
input = "compose"
sources = ["lossy-compose.yaml"]
protected-values = ["LABEL-CANARY", "ANNOTATION-CANARY", "LOGOPT-CANARY"]

[extensions.scenarios.exports.compose]
loss-policy = "partial"
diagnostic-codes = ["BFC0007"]
artifact-values = ["LABEL-CANARY", "ANNOTATION-CANARY", "LOGOPT-CANARY"]

[[extensions.scenarios.exports.compose.artifacts]]
artifact = "compose.yaml"
expected = "expected-lossy-compose-after-quadlet.yaml"

[extensions.scenarios.exports.quadlet]
loss-policy = "partial"
diagnostic-codes = ["BFQ0003", "BFQ0007", "BFQ0007"]
fixed-diagnostic-codes = ["BFQ0007", "BFQ0007", "BFQ1003", "BFQ1003"]
podman-minimum = "5.4.0"
podman-maximum = "6.0.2"
artifact-values = ["LABEL-CANARY", "ANNOTATION-CANARY", "LOGOPT-CANARY"]

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "web.container"
expected = "expected-lossy-web.container"

[extensions.scenarios.exports.podman]
loss-policy = "partial"
diagnostic-codes = ["BFP0007", "BFP0007", "BFP0007"]
artifact-values = ["LABEL-CANARY"]

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman-commands.sh"
expected = "expected-lossy-podman-commands.sh"

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman.json"
expected = "expected-lossy-podman.json"

[[extensions.scenarios]]
id = "tmpfs-compose"
input = "compose"
sources = ["tmpfs-compose.yaml"]

[extensions.scenarios.exports.compose]
loss-policy = "exact"

[[extensions.scenarios.exports.compose.artifacts]]
artifact = "compose.yaml"
expected = "expected-tmpfs-compose.yaml"

[extensions.scenarios.exports.quadlet]
loss-policy = "exact"
podman-minimum = "5.4.0"
podman-maximum = "6.0.2"

[[extensions.scenarios.exports.quadlet.artifacts]]
artifact = "worker.container"
expected = "expected-tmpfs-worker.container"

[extensions.scenarios.exports.podman]
loss-policy = "exact"
podman-tmpfs-destinations = ["/run/boxferry"]

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman-commands.sh"
expected = "expected-tmpfs-podman-commands.sh"

[[extensions.scenarios.exports.podman.artifacts]]
artifact = "podman.json"
expected = "expected-tmpfs-podman.json"
