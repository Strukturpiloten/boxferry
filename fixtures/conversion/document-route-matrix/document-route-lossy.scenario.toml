diagnostics = [
  "BFP0007|services.web.healthcheck",
  "BFP0007|services.web.annotations",
  "BFP0007|services.web.logging",
]
semantic-gaps = ["healthcheck:web"]
allowed-losses = [
  { rule = "BFP0007", subject = "services.web.healthcheck", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
  { rule = "BFP0007", subject = "services.web.annotations", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
  { rule = "BFP0007", subject = "services.web.logging", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
