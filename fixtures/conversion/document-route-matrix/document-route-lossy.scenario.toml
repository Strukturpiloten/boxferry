schema = 1
id = "document-route-lossy"
source-capabilities = ["compose"]
target-capabilities = ["compose", "podman", "quadlet"]
protected-values = ["LABEL-CANARY", "ANNOTATION-CANARY", "LOGOPT-CANARY"]

[application]
name = "lossy-chain"
version = "1.0.0"

[[components]]
name = "web"
version = "1.0.0"
configured-image = "example.invalid/web:1"

[[native-inputs]]
id = "compose"
importer = "compose"
files = ["lossy-compose.yaml"]
format-version = "compose-specification"

[provenance]
source = "authored"
license = "MPL-2.0"
privacy-reviewed = true
test-data = "Repository-authored lossy-route canaries; no user data or credentials."
image-evidence = "Synthetic example.invalid image identity used only for offline assertions."

[deployment]
origin = "authored"
root-mode = "not-applicable"

[semantics]
selected-resources = ["service:web"]
required-healthchecks = [
  { service = "web", command-kind = "exec", command = ["/usr/bin/healthcheck"] },
]
external-prerequisites = []
expected-diagnostics = []

[[evidence]]
input = "compose"
exporter = "compose"
target-implementation = "compose-specification"
target-minimum = "1.0.0"
target-maximum = "1.0.0"
loss-policy = "partial"
outcome = "known-migration-gap"
reason = "Compose output cannot retain the reviewed healthcheck representation."
artifacts = ["compose.yaml"]
native-validation = { state = "passed" }
runtime-probe = { state = "not-applicable", reason = "Offline authored fixture; no runtime operation is claimed." }
reimport = { state = "known-migration-gap", reason = "Generated Compose cannot reconstruct the reviewed semantic gaps." }
diagnostics = ["BFC0007|services.web.healthcheck"]
semantic-gaps = ["healthcheck:web"]
reimport-semantic-gaps = ["healthcheck:web"]
allowed-losses = [
  { rule = "BFC0007", subject = "services.web.healthcheck", decision = "unsupported", version-scope = "compose-specification@1.0.0..1.0.0" },
]

[[evidence]]
input = "compose"
exporter = "quadlet"
target-implementation = "podman"
target-minimum = "5.4.0"
target-maximum = "6.1.0"
loss-policy = "partial"
outcome = "known-migration-gap"
reason = "Quadlet omits healthcheck start interval and approximates logging settings."
artifacts = ["web.container"]
native-validation = { state = "passed" }
runtime-probe = { state = "not-applicable", reason = "Offline authored fixture; no runtime operation is claimed." }
reimport = { state = "passed" }
diagnostics = [
  "BFQ0003|services.web.healthcheck.start_interval",
  "BFQ0007|services.web.logging.driver",
  "BFQ0007|services.web.logging.options.tag",
]
reimport-diagnostics = ["BFQ1003|<global>", "BFQ1003|<global>"]
reimport-version-scope = "quadlet-lens@0.2.3..0.2.3"
semantic-gaps = [
  "healthcheck-start-interval:web",
  "logging:web:driver",
  "logging:web:options.tag",
]
allowed-losses = [
  { rule = "BFQ0003", subject = "services.web.healthcheck.start_interval", decision = "unsupported", version-scope = "podman@5.4.0..6.1.0" },
  { rule = "BFQ0007", subject = "services.web.logging.driver", decision = "approximate", version-scope = "podman@5.4.0..6.1.0" },
  { rule = "BFQ0007", subject = "services.web.logging.options.tag", decision = "approximate", version-scope = "podman@5.4.0..6.1.0" },
]
reimport-allowed-losses = [
  { rule = "BFQ1003", subject = "services.web.logging.driver", decision = "unsupported", version-scope = "quadlet-lens@0.2.3..0.2.3" },
  { rule = "BFQ1003", subject = "services.web.logging.options", decision = "unsupported", version-scope = "quadlet-lens@0.2.3..0.2.3" },
]

[[evidence]]
input = "compose"
exporter = "podman"
target-implementation = "podman"
target-minimum = "5.4.0"
target-maximum = "6.1.0"
loss-policy = "partial"
outcome = "known-migration-gap"
reason = "Podman deployment output omits healthcheck, annotations, and logging intent."
artifacts = ["podman-commands.sh", "podman.json"]
native-validation = { state = "passed" }
runtime-probe = { state = "not-applicable", reason = "Offline authored fixture; no runtime operation is claimed." }
