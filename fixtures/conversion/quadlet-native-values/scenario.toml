schema = 1
id = "quadlet-native-values"
source-capabilities = ["quadlet"]
target-capabilities = ["compose", "podman", "quadlet"]
protected-values = ["hello quoted command", "hello native world"]

[application]
name = "quadlet-native-values"
version = "1.0.0"

[[components]]
name = "native"
version = "1.0.0"
configured-image = "example.invalid/quadlet-native-values:1"

[[native-inputs]]
id = "quadlet"
importer = "quadlet"
files = ["native.container"]
format-version = "0.2.3"
import-diagnostics = ["BFQ1003|<global>", "BFQ1003|<global>"]

[provenance]
source = "authored"
license = "MPL-2.0"
privacy-reviewed = true
test-data = "Repository-authored Quadlet quoting, mount, and publication values."
image-evidence = "Synthetic example.invalid image identity used only for offline assertions."

[deployment]
origin = "quadlet"
root-mode = "not-applicable"

[semantics]
selected-resources = ["service:native", "volume:external-data"]
ownership-boundaries = ["volume:external-data:external"]
shared-boundaries = ["volume:external-data:consumers=native"]
required-environment = ["native:GREETING=hello native world", "native:EMPTY="]
required-bind-mounts = [
  { service = "native", source = "/srv/native", target = "/etc/native", read-only = true, selinux-relabel = "shared" },
]
required-commands = [
  { service = "native", kind = "exec", values = ["/usr/bin/printf", "hello quoted command"] },
]
required-entrypoints = [
  { service = "native", kind = "exec", values = ["/usr/bin/env", "sh"] },
]
required-port-bindings = [
  { service = "native", container = 8080, published = 18080, host-address = "::1", protocol = "tcp" },
]
required-volume-mounts = [
  { service = "native", source = "external-data", target = "/var/lib/native", read-only = true, selinux-relabel = "private" },
]
external-prerequisites = []
expected-diagnostics = ["BFQ1003|<global>", "BFQ1003|<global>"]

[[evidence]]
input = "quadlet"
exporter = "compose"
target-implementation = "compose-specification"
target-minimum = "1.0.0"
target-maximum = "1.0.0"
loss-policy = "partial"
outcome = "known-migration-gap"
reason = "Compose cannot retain the named-volume SELinux relabel, native port range, or native tmpfs mount."
artifacts = ["compose.yaml"]
native-validation = { state = "passed" }
runtime-probe = { state = "not-applicable", reason = "Offline authored fixture; no runtime operation is claimed." }
reimport = { state = "known-migration-gap", reason = "Generated Compose cannot reconstruct the reviewed semantic gaps." }
diagnostics = [
  "BFQ1003|<global>",
  "BFQ1003|<global>",
  "BFC0007|services.native.mounts[0]",
]
semantic-gaps = ["volume-mount:native:/var/lib/native"]
reimport-semantic-gaps = ["volume-mount:native:/var/lib/native"]
allowed-losses = [
  { rule = "BFQ1003", subject = "services.native.ports[1]", decision = "unsupported", version-scope = "compose-specification@1.0.0..1.0.0" },
  { rule = "BFQ1003", subject = "services.native.mounts[2]", decision = "unsupported", version-scope = "compose-specification@1.0.0..1.0.0" },
  { rule = "BFC0007", subject = "services.native.mounts[0]", decision = "unsupported", version-scope = "compose-specification@1.0.0..1.0.0" },
]

