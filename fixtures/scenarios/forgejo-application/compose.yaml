---
name: forgejo-application

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo@sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685
    user: "1000:1000"
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${BF_FORGEJO_DB_PASSWORD:?required}
      FORGEJO__database__SSL_MODE: disable
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${BF_FORGEJO_SECRET_KEY:?required}
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__ROOT_URL: http://127.0.0.1:13000/
      FORGEJO__server__SSH_DOMAIN: 127.0.0.1
      FORGEJO__server__SSH_PORT: "12222"
    ports:
      - "127.0.0.1:13000:3000"
      - "127.0.0.1:12222:2222"
    volumes:
      - forgejo-data:/var/lib/gitea
    networks:
      - backend
      - edge

  db:
    image: docker.io/library/postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${BF_FORGEJO_DB_PASSWORD:?required}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    internal: true
  edge:
    external: true

volumes:
  forgejo-data:
  db-data:
