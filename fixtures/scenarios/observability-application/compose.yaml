---
name: observability-application
services:
  alloy:
    image: docker.io/grafana/alloy@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    command:
      - run
      - "--storage.path=/var/lib/alloy/data"
      - /etc/alloy/config.alloy
    volumes:
      - type: volume
        source: alloy-data
        target: /var/lib/alloy/data
      - type: volume
        source: telemetry-logs
        target: /var/log/boxferry
        read_only: true
    networks:
      backend: {}
  grafana:
    image: docker.io/grafana/grafana@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=boxferry-public-observability-admin-canary
    ports:
      - target: 3000
        published: "13000"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
    networks:
      backend: {}
  log-producer:
    image: docker.io/library/nginx@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    command:
      - sleep
      - "86400"
    volumes:
      - type: volume
        source: telemetry-logs
        target: /var/log/boxferry
    networks:
      backend: {}
  loki:
    image: docker.io/grafana/loki@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - type: volume
        source: loki-data
        target: /loki
    networks:
      backend: {}
  metrics-producer:
    image: docker.io/library/nginx@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    command:
      - sleep
      - "86400"
    networks:
      backend: {}
  prometheus:
    image: docker.io/prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-remote-write-receiver"
    volumes:
      - type: volume
        source: prometheus-data
        target: /prometheus
    networks:
      backend: {}
networks:
  backend:
    internal: true
volumes:
  alloy-data: {}
  grafana-data: {}
  loki-data: {}
  prometheus-data: {}
  telemetry-logs: {}
