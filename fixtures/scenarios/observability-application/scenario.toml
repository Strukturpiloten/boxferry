[[native-inputs]]
id = "compose"
importer = "compose"
files = ["compose.yaml"]
format-version = "compose-specification"
interpolate = true
environment-files = ["observability.env.example"]
import-diagnostics = []

[[native-inputs]]
id = "quadlet"
importer = "quadlet"
files = [
  "backend.network",
  "alloy-data.volume",
  "grafana-data.volume",
  "loki-data.volume",
  "prometheus-data.volume",
  "telemetry-logs.volume",
  "alloy.container",
  "grafana.container",
  "log-producer.container",
  "loki.container",
  "metrics-producer.container",
  "prometheus.container",
]
format-version = "0.2.3"
import-diagnostics = []

[[native-inputs]]
id = "podman"
importer = "podman"
files = ["input-podman.cassette.json"]
format-version = "6.1.0"
import-diagnostics-file = "expected.podman-import.diagnostics"

[native-inputs.podman]
application = "observability-application"
cassette-scenario-id = "observability-application-authored-podman-6.1.0"
root-mode = "rootless"
include-environment-values = true
selectors = [
  { kind = "container", exact = "alloy" },
  { kind = "container", exact = "grafana" },
  { kind = "container", exact = "log-producer" },
  { kind = "container", exact = "loki" },
  { kind = "container", exact = "metrics-producer" },
  { kind = "container", exact = "prometheus" },
  { kind = "network", exact = "backend" },
  { kind = "volume", exact = "alloy-data" },
  { kind = "volume", exact = "grafana-data" },
  { kind = "volume", exact = "loki-data" },
  { kind = "volume", exact = "prometheus-data" },
  { kind = "volume", exact = "telemetry-logs" },
]
promotion-policy = { effective-bind-mounts = false, effective-named-volume-mounts = true, effective-named-networks = true, portable-effective-settings = true }

[provenance]
source = "authored"
license = "MPL-2.0"
privacy-reviewed = true
test-data = "Deterministic metric value, log line, public invalid-domain password canary, digest-only native acquisition evidence, and no host or production telemetry."
image-evidence = "Reviewed linux/amd64 tag and digest identities are recorded in fixtures/conformance/observability-application/images.tsv; offline importers never pull images and this fixture alone makes no runtime claim."

[deployment]
origin = "authored"
root-mode = "not-applicable"

[semantics]
selected-resources = [
  "network:backend",
  "service:alloy",
  "service:grafana",
  "service:log-producer",
  "service:loki",
  "service:metrics-producer",
  "service:prometheus",
  "volume:alloy-data",
  "volume:grafana-data",
  "volume:loki-data",
  "volume:prometheus-data",
  "volume:telemetry-logs",
]
excluded-resources = []
ownership-boundaries = [
  "volume:alloy-data:application",
  "volume:grafana-data:application",
  "volume:loki-data:application",
  "volume:prometheus-data:application",
  "volume:telemetry-logs:application",
]
shared-boundaries = [
  "volume:alloy-data:consumers=alloy",
  "volume:grafana-data:consumers=grafana",
  "volume:loki-data:consumers=loki",
  "volume:prometheus-data:consumers=prometheus",
  "volume:telemetry-logs:consumers=alloy,log-producer",
]
required-mounts = [
  "alloy:alloy-data:/var/lib/alloy/data",
  "grafana:grafana-data:/var/lib/grafana",
  "log-producer:telemetry-logs:/var/log/boxferry",
  "loki:loki-data:/loki",
  "prometheus:prometheus-data:/prometheus",
]
required-environment = [
  "grafana:GF_SECURITY_ADMIN_PASSWORD=boxferry-public-observability-admin-canary",
]
required-ports = ["grafana:13000:3000/tcp"]
required-networks = [
  { name = "backend", ownership = "application", internal = true },
]
required-commands = [
  { service = "alloy", kind = "exec", values = ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"] },
  { service = "grafana", kind = "absent" },
  { service = "log-producer", kind = "exec", values = ["sleep", "86400"] },
  { service = "loki", kind = "exec", values = ["-config.file=/etc/loki/local-config.yaml"] },
  { service = "metrics-producer", kind = "exec", values = ["sleep", "86400"] },
  { service = "prometheus", kind = "exec", values = ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h", "--web.enable-remote-write-receiver"] },
]
required-entrypoints = [
  { service = "alloy", kind = "absent" },
  { service = "grafana", kind = "absent" },
  { service = "log-producer", kind = "absent" },
  { service = "loki", kind = "absent" },
  { service = "metrics-producer", kind = "absent" },
  { service = "prometheus", kind = "absent" },
]
required-image-sources = [
  { service = "alloy", kind = "literal", value = "docker.io/grafana/alloy@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839" },
  { service = "grafana", kind = "literal", value = "docker.io/grafana/grafana@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283" },
  { service = "log-producer", kind = "literal", value = "docker.io/library/nginx@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8" },
  { service = "loki", kind = "literal", value = "docker.io/grafana/loki@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500" },
  { service = "metrics-producer", kind = "literal", value = "docker.io/library/nginx@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8" },
  { service = "prometheus", kind = "literal", value = "docker.io/prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0" },
]
required-port-bindings = [
  { service = "grafana", container = 3000, published = 13000, host-address = "127.0.0.1", protocol = "tcp" },
]
required-volume-mounts = [
  { service = "alloy", source = "alloy-data", target = "/var/lib/alloy/data", read-only = false },
  { service = "alloy", source = "telemetry-logs", target = "/var/log/boxferry", read-only = true },
  { service = "grafana", source = "grafana-data", target = "/var/lib/grafana", read-only = false },
  { service = "log-producer", source = "telemetry-logs", target = "/var/log/boxferry", read-only = false },
  { service = "loki", source = "loki-data", target = "/loki", read-only = false },
  { service = "prometheus", source = "prometheus-data", target = "/prometheus", read-only = false },
]

