schema = 1
id = "podman-portable-intent"
source-capabilities = ["podman"]
target-capabilities = ["compose", "podman", "quadlet"]

[application]
name = "podman-portable-intent"
version = "1.0.0"

[[components]]
name = "portable-app"
version = "1.0.0"
image = "example.invalid/portable/app"
digest = "sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
configured-image = "example.invalid/portable/app:1.0.0"

[[native-inputs]]
id = "podman"
importer = "podman"
files = ["input-podman.cassette.json"]
format-version = "6.1.0"

[native-inputs.podman]
application = "podman-portable-intent"
include-environment-values = true
selectors = [{ kind = "container", exact = "portable-app" }]
promotion-policy = { effective-bind-mounts = true, effective-named-volume-mounts = true, effective-named-networks = true, portable-effective-settings = true }

[provenance]
source = "authored"
license = "MPL-2.0"
privacy-reviewed = true
test-data = "Repository-authored deterministic Libpod JSON; synthetic names, paths, addresses, and explicit test-only environment canaries only."
image-evidence = "The configured tag is the independent semantic expectation; the synthetic digest-shaped observation is provenance evidence only and was never pulled."

[deployment]
origin = "native-cli"
root-mode = "rootful"

[semantics]
selected-resources = ["network:scenario-net", "service:portable-app"]
excluded-resources = []
ownership-boundaries = []
shared-boundaries = []
required-mounts = []
required-bind-mounts = [
  { service = "portable-app", source = "/srv/boxferry-scenario/private", target = "/etc/boxferry-scenario", read-only = true, selinux-relabel = "private" },
  { service = "portable-app", source = "/srv/boxferry-scenario/shared", target = "/srv/boxferry-scenario", read-only = false, selinux-relabel = "shared" },
]
required-environment = [
  "portable-app:ZETA=podman-portable-zeta-canary",
  "portable-app:ALPHA=podman-portable-alpha-canary",
  "portable-app:EMPTY=",
]
required-environment-order = [
  "portable-app:ZETA=podman-portable-zeta-canary",
  "portable-app:ALPHA=podman-portable-alpha-canary",
  "portable-app:EMPTY=",
]
required-ports = []
unpublished-services = []
external-prerequisites = []
expected-diagnostics = [
  "BFP0002|container:portable-app",
  "BFP0003|networks.scenario-net.internal",
  "BFP0003|networks.scenario-net.ipam",
  "BFP0003|services.portable-app.environment",
  "BFP0003|services.portable-app.mounts[0]",
  "BFP0003|services.portable-app.mounts[1]",
  "BFP0003|services.portable-app.namespaces",
  "BFP0003|services.portable-app.networks",
  "BFP0003|services.portable-app.resource_controls",
  "BFP0003|services.portable-app.restart_policy",
  "BFP0003|services.portable-app.security",
]
required-networks = [{ name = "scenario-net", ownership = "application", internal = true, ipv6 = true, ipam = [{ subnet = "10.89.0.0/24", gateway = "10.89.0.1", ip-range = "10.89.0.64-10.89.0.127" }, { subnet = "fd42:bf::/64", gateway = "fd42:bf::1", ip-range = "fd42:bf::100-fd42:bf::1ff" }] }]

