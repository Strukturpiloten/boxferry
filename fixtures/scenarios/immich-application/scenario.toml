importer = "compose"
files = ["compose.yaml"]
format-version = "compose-specification"
interpolate = true
environment-files = ["immich.env.example"]
import-diagnostics = []

[[native-inputs]]
id = "quadlet"
importer = "quadlet"
files = [
  "backend.network",
  "database.container",
  "edge.network",
  "immich-machine-learning.container",
  "immich-server.container",
  "library.volume",
  "model-cache.volume",
  "pgdata.volume",
  "redis.container",
  "redisdata.volume",
]
format-version = "0.2.3"
import-diagnostics = []

[[native-inputs]]
id = "podman"
importer = "podman"
files = ["input-podman.cassette.json"]
format-version = "6.1.0"
import-diagnostics-file = "expected.podman-import.diagnostics"

[native-inputs.podman]
application = "immich-application"
cassette-scenario-id = "immich-application-authored-podman-6.1.0"
root-mode = "rootless"
include-environment-values = true
selectors = [
  { kind = "container", exact = "database" },
  { kind = "container", exact = "immich-machine-learning" },
  { kind = "container", exact = "immich-server" },
  { kind = "container", exact = "redis" },
  { kind = "network", exact = "backend" },
  { kind = "network", exact = "edge" },
  { kind = "volume", exact = "library" },
  { kind = "volume", exact = "model-cache" },
  { kind = "volume", exact = "pgdata" },
  { kind = "volume", exact = "redisdata" },
]
promotion-policy = { effective-bind-mounts = false, effective-named-volume-mounts = true, effective-named-networks = true, portable-effective-settings = true }

[provenance]
source = "authored"
license = "MPL-2.0"
privacy-reviewed = true
test-data = "Repository-authored offline Immich definitions and deterministic Libpod replay with a conspicuously public canary remain the sole semantic input. The separately admitted, fully redacted captured-native cassette under fixtures/conformance is supplementary production-acquisition evidence and must not replace this input."
image-evidence = "Reviewed Immich 3.1.0 CPU-only, Valkey 9, and PostgreSQL 14 VectorChord image identities; offline semantic tests never pull images or claim media processing. Supplementary captured evidence binds all four reviewed live images to Podman 6.1 rootless."

[deployment]
origin = "authored"
root-mode = "not-applicable"

[semantics]
selected-resources = [
  "network:backend",
  "network:edge",
  "service:database",
  "service:immich-machine-learning",
  "service:immich-server",
  "service:redis",
  "volume:library",
