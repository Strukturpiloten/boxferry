---
name: Release preparation

on:
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - "scripts/shared-release-policy.json"
      - ".github/workflows/release-plz.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "crates/**/Cargo.toml"
      - "crates/**/*.rs"
      - "release-plz.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions: {}

env:
  RELEASE_GITHUB_API_VERSION: "2026-03-10"

jobs:
  prepare-release-pr:
    name: Prepare release pull request
    if: github.repository == 'Strukturpiloten/boxferry'
    permissions:
      contents: read
    # Reviewed immutable bootstrap infrastructure; no automation release exists yet.
    uses: Strukturpiloten/boxferry/.github/workflows/shared-release-prepare.yml@7b9ce867e0de8b05ee5d084581cad7de54d06459 # automation-v1 interface v1
    with:
      candidate_sha: ${{ github.sha }}
      automation_sha: 7b9ce867e0de8b05ee5d084581cad7de54d06459
      policy_sha: ${{ github.sha }}
      config_path: scripts/shared-validation-policy.json
      app_client_id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

  dispatch-release:
    name: Dispatch protected release after release-plz merge
    if: github.event_name == 'push' && github.repository == 'Strukturpiloten/boxferry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check whether this push merged a release-plz pull request
        id: release-pr
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          associated_pull_requests="$(
            gh api \
              --header "X-GitHub-Api-Version: ${RELEASE_GITHUB_API_VERSION}" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
          )"
          release_pull_requests="$(
            jq --compact-output \
              --arg base "${DEFAULT_BRANCH}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              '[
                .[] |
                select(
                  .merged_at != null and
                  .base.ref == $base and
                  .head.repo.full_name == $repository and
                  (.head.ref | startswith("release-plz-"))
                )
              ]' <<< "${associated_pull_requests}"
          )"
          release_pull_request_count="$(
            jq --raw-output 'length' <<< "${release_pull_requests}"
          )"

          if [[ "${release_pull_request_count}" == "0" ]]; then
            associated_heads="$(
              jq --raw-output \
                '[.[].head.ref] | if length == 0 then "none" else join(", ") end' \
                <<< "${associated_pull_requests}"
            )"
            echo "No merged release-plz-* pull request is associated with ${GITHUB_SHA}."
            echo "Associated pull-request heads: ${associated_heads}. No release was dispatched."
            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${release_pull_request_count}" != "1" ]]; then
            echo "Expected one merged release-plz-* pull request; found ${release_pull_request_count}." >&2
            exit 1
          fi

          release_pull_request="$(
            jq --raw-output \
              '.[0] | "#\(.number) (\(.head.ref))"' \
              <<< "${release_pull_requests}"
          )"
          echo "Merged release pull request ${release_pull_request} will dispatch release.yml."
          echo "dispatch=true" >> "${GITHUB_OUTPUT}"

      - name: Dispatch protected release workflow
        if: steps.release-pr.outputs.dispatch == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            --header "X-GitHub-Api-Version: ${RELEASE_GITHUB_API_VERSION}" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref="${DEFAULT_BRANCH}"
          echo "Dispatched release.yml on ${DEFAULT_BRANCH} for ${GITHUB_SHA}."
