---
name: Shared dependency admission reader

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact caller revision tested by this run.
        required: true
        type: string
      automation_sha:
        description: Immutable BoxFerry commit matching this workflow's full SHA reference.
        required: true
        type: string
      policy_sha:
        description: Exact trusted PR or queue base; candidate SHA for complete events.
        required: true
        type: string
    outputs:
      candidate_sha:
        description: Exact candidate whose admission stage succeeded.
        value: ${{ jobs.check.outputs.candidate_sha }}
      admission_implementation_sha:
        description: Trusted base automation A that approved admission; empty when not applicable.
        value: ${{ jobs.check.outputs.admission_implementation_sha }}
      admission_status:
        description: Eligible under the trusted base policy, or explicitly not-applicable.
        value: ${{ jobs.check.outputs.admission_status }}

      admission_evidence_kind:
        description: Exact-A receipt or computed read-only zero-age-delta evidence.
        value: ${{ jobs.check.outputs.admission_evidence_kind }}
      admission_proof_implementation_sha:
        description: Actual live proof implementation S; empty for receipt evidence.
        value: ${{ jobs.check.outputs.admission_proof_implementation_sha }}
permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  check:
    name: Dependency eligibility
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.result.outputs.candidate_sha }}
      admission_implementation_sha: ${{ steps.result.outputs.admission_implementation_sha }}
      admission_status: ${{ steps.result.outputs.admission_status }}
      admission_evidence_kind: ${{ steps.result.outputs.admission_evidence_kind }}
      admission_proof_implementation_sha: ${{ steps.result.outputs.admission_proof_implementation_sha }}
    steps:
      - name: Reject floating references before checking out setup code
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
          POLICY_SHA: ${{ inputs.policy_sha }}
        run: |
          set -euo pipefail
          for revision in "${CANDIDATE_SHA}" "${AUTOMATION_SHA}" "${POLICY_SHA}"; do
            if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Admission setup requires full lowercase commit SHAs.' >&2
              exit 2
            fi
          done
      - name: Check out the immutable proposed setup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          ref: ${{ inputs.automation_sha }}
          path: _proposed_automation
          persist-credentials: false
      - name: Check out the independently trusted consumer base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.policy_sha }}
          path: _policy
          persist-credentials: false
      - name: Resolve admission authority from the exact base Git object
        id: policy
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
          POLICY_SHA: ${{ inputs.policy_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          python3 _proposed_automation/automation/src/boxferry_ci/admission.py \
            --repository "${GITHUB_REPOSITORY}" --event-name "${GITHUB_EVENT_NAME}" \
            --candidate-sha "${CANDIDATE_SHA}" --tested-sha "${GITHUB_SHA}" \
            --automation-sha "${AUTOMATION_SHA}" --policy-sha "${POLICY_SHA}" \
            --pr-base-sha "${PR_BASE_SHA}" --queue-base-sha "${QUEUE_BASE_SHA}" \
            --implementation-root _proposed_automation --policy-root _policy \
            --github-output "${GITHUB_OUTPUT}" --summary "${GITHUB_STEP_SUMMARY}"
      - name: Check out the trusted base admission implementation A
        if: steps.policy.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          ref: ${{ steps.policy.outputs.policy_automation_sha }}
          path: _automation
          persist-credentials: false
      - name: Verify the held admission source A
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          ADMISSION_SHA: ${{ steps.policy.outputs.policy_automation_sha }}
        run: test "$(git -C _automation rev-parse HEAD)" = "${ADMISSION_SHA}"
      - name: Detect the immutable admission reader capability
        if: steps.policy.outputs.required == 'true'
        id: reader
        shell: bash
        run: |
          set -euo pipefail
          capability="$(PYTHONPATH="${GITHUB_WORKSPACE}/_proposed_automation/automation/src" \
            python3 -P -m boxferry_ci.eligibility reader-contract \
            --module-path _automation/automation/src/boxferry_ci/eligibility.py)"
          test "${capability}" = 1 || test "${capability}" = 2
          printf 'contract=%s\n' "${capability}" >> "${GITHUB_OUTPUT}"
      - name: Install A's canonical locked Python tooling
        if: steps.policy.outputs.required == 'true'
        uses: ./_automation/.github/actions/shared-python
      - name: Compute the bounded read-only zero-age-delta proof
        if: steps.policy.outputs.required == 'true'
        id: zero
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
          POLICY_SHA: ${{ inputs.policy_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/_proposed_automation/automation/src" \
            uv run --locked --project _automation/automation python -P -B \
            -m boxferry_ci.zero_age_delta \
            --repository "${GITHUB_REPOSITORY}" --event-name "${GITHUB_EVENT_NAME}" \
            --candidate-sha "${CANDIDATE_SHA}" --tested-sha "${GITHUB_SHA}" \
            --automation-sha "${AUTOMATION_SHA}" --policy-sha "${POLICY_SHA}" \
            --pr-base-sha "${PR_BASE_SHA}" --queue-base-sha "${QUEUE_BASE_SHA}" \
            --implementation-root _proposed_automation --authority-root _automation \
            --policy-root _policy \
            --event-path "${GITHUB_EVENT_PATH}" --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}" --summary "${GITHUB_STEP_SUMMARY}"
      # This artifact is an untrusted run/attempt-scoped hint, never execution provenance.
      - name: Record a bounded candidate hint for the trusted service
        if: github.event_name == 'pull_request' && steps.policy.outputs.required == 'true'
        shell: bash
        env:
          HINT_CANDIDATE: ${{ github.sha }}
          HINT_BASE: ${{ github.event.pull_request.base.sha }}
          HINT_SOURCE: ${{ github.event.pull_request.head.sha }}
          HINT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY_HINT'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": 1, "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pull_request": int(os.environ["HINT_PR"]),
              "candidate_sha": os.environ["HINT_CANDIDATE"],
              "base_sha": os.environ["HINT_BASE"],
              "source_head_sha": os.environ["HINT_SOURCE"],
          }
          Path(os.environ["RUNNER_TEMP"], "dependency-candidate-hint.json").write_text(
              json.dumps(payload) + "\n", encoding="utf-8"
          )
          PY_HINT
      - name: Retain the untrusted candidate hint
        if: github.event_name == 'pull_request' && steps.policy.outputs.required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-candidate-hint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-candidate-hint.json
          if-no-files-found: error
          retention-days: 30
      - name: Read the exact candidate receipt under A's policy
        if: steps.policy.outputs.required == 'true' && steps.zero.outputs.status != 'proved-zero'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ADMISSION_SHA: ${{ steps.policy.outputs.policy_automation_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.policy_sha }}
          READER_CONTRACT: ${{ steps.reader.outputs.contract }}
        shell: bash
        run: |
          set -euo pipefail
          expected_base=()
          case "${READER_CONTRACT}" in
            1) ;; # The unchanged legacy parser has no expected-base option.
            2) expected_base=(--expected-base-sha "${EXPECTED_BASE_SHA}") ;;
            *) echo 'Unknown immutable admission reader contract.' >&2; exit 2 ;;
          esac
          uv run --locked --project _automation/automation python -m boxferry_ci.eligibility wait \
            --repository "${GITHUB_REPOSITORY}" --candidate-sha "${CANDIDATE_SHA}" \
            --implementation-revision "${ADMISSION_SHA}" "${expected_base[@]}" \
            --summary "${GITHUB_STEP_SUMMARY}"
      - name: Expose successful admission evidence without claiming B-policy approval
        id: result
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ADMISSION_SHA: ${{ steps.policy.outputs.policy_automation_sha }}
          ADMISSION_REQUIRED: ${{ steps.policy.outputs.required }}
          ZERO_STATUS: ${{ steps.zero.outputs.status }}
          PROOF_SHA: ${{ steps.zero.outputs.proof_implementation_sha }}
        shell: bash
        run: |
          printf 'candidate_sha=%s\n' "${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'admission_implementation_sha=%s\n' "${ADMISSION_SHA}" >> "${GITHUB_OUTPUT}"
          if [[ "${ADMISSION_REQUIRED}" == true ]]; then
            printf 'admission_status=eligible\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'admission_status=not-applicable\n' >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${ZERO_STATUS}" == proved-zero ]]; then
            printf 'admission_evidence_kind=read-only-zero-age-delta\n' >> "${GITHUB_OUTPUT}"
            printf 'admission_proof_implementation_sha=%s\n' "${PROOF_SHA}" >> "${GITHUB_OUTPUT}"
          elif [[ "${ADMISSION_REQUIRED}" == true ]]; then
            printf 'admission_evidence_kind=exact-A-service-receipt\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'admission_evidence_kind=not-applicable\n' >> "${GITHUB_OUTPUT}"
          fi
