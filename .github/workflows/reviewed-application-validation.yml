---
name: Reviewed PR application validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number reviewed for application execution.
        required: true
        type: string
      expected_sha:
        description: Full lowercase SHA of the PR's current reviewed head.
        required: true
        type: string
      task:
        description: One bounded application contract to run on the reviewed head.
        required: true
        type: choice
        options:
          - nextcloud-application
          - paperless-application
          - immich-application

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reviewed-application-${{ inputs.pr_number }}-${{ inputs.task }}
  cancel-in-progress: false

env:
  # Reviewed DockerLens #42 merge; unreleased shared CI helper pinned by immutable commit.
  # renovate: datasource=github-digest depName=Strukturpiloten/docker-lens currentValue=main
  ADMISSION_REVISION: c1b79d6af1b29f036b7704efc225fbd648e0b1cc

jobs:
  admission:
    name: Admit exact reviewed PR head
    if: github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out immutable shared admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ env.ADMISSION_REVISION }}
          path: admission
          persist-credentials: false
      - name: Verify shared admission pin and current PR permissions
        env:
          EXPECTED_REPOSITORY: Strukturpiloten/boxferry
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C admission rev-parse HEAD)" = "${ADMISSION_REVISION}"
          python3 admission/scripts/native-dispatch-admission.py

  application:
    name: Reviewed PR / ${{ inputs.task }}
    needs: admission
    if: github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TASK: ${{ inputs.task }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_PATH: target/migration-readiness/reviewed-application.json
      BOXFERRY_BIN: ${{ github.workspace }}/candidate/target/debug/boxferry
      BOXFERRY_COMPOSE_BIN: ${{ github.workspace }}/candidate/target/tools/docker-compose
    steps:
      - name: Check out immutable shared admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ env.ADMISSION_REVISION }}
          path: admission
          persist-credentials: false
      - name: Recheck exact PR head and both actors before candidate checkout
        env:
          EXPECTED_REPOSITORY: Strukturpiloten/boxferry
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C admission rev-parse HEAD)" = "${ADMISSION_REVISION}"
          python3 admission/scripts/native-dispatch-admission.py
      - name: Check out trusted application budget policy separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out exact reviewed candidate separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          path: candidate
          persist-credentials: false
      - name: Admit candidate catalogue with trusted policy and verify exact SHA
        id: plan
        working-directory: candidate
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          case "${TASK}" in
            nextcloud-application|paperless-application|immich-application) ;;
            *) exit 2 ;;
          esac
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git -C ../trusted rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 ../trusted/scripts/reviewed-application-catalogue.py \
            --trusted-root ../trusted --candidate-root . --verifier-root ../verifier \
            --task "${TASK}"
          python3 ../verifier/scripts/migration-readiness.py plan \
            --tier pre-release --task "${TASK}" --format json > plan.json
          jq -e --arg task "${TASK}" \
            '.tier == "pre-release" and (.tasks | length) == 1 and
             .tasks[0].id == $task and .tasks[0].privileged == true and
             (.tasks[0].required_environment | index("BOXFERRY_BIN") != null) and
             (.tasks[0].required_environment | index("BOXFERRY_COMPOSE_BIN") != null)' plan.json
      - name: Install live prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libcap2-bin podman skopeo
      - name: Build exact candidate with locked dependencies
        working-directory: candidate
        run: cargo build --locked --package boxferry --bin boxferry --features podman
      - name: Download verified Docker Compose provider
        working-directory: candidate
        run: |
          set -euo pipefail
          source scripts/lib/compose-provider.sh
          boxferry_install_compose_provider target/tools/docker-compose
      - name: Run one bounded application contract
        id: execute
        continue-on-error: true
        working-directory: candidate
        run: |
          set -euo pipefail
          sudo env PATH="${PATH}" \
            CARGO_HOME="/home/runner/.cargo" \
            RUSTUP_HOME="/home/runner/.rustup" \
            GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            BOXFERRY_BIN="${BOXFERRY_BIN}" \
            BOXFERRY_COMPOSE_BIN="${BOXFERRY_COMPOSE_BIN}" \
            python3 scripts/migration-readiness.py run \
              --tier pre-release --task "${TASK}" \
              --revision "${EXPECTED_SHA}" --evidence "${EVIDENCE_PATH}"
      - name: Restore bounded evidence ownership
        if: always()
        working-directory: candidate
        run: |
          if [[ -e target/migration-readiness ]]; then
            sudo chown --recursive "$(id -u):$(id -g)" target/migration-readiness
          fi
      - name: Validate exact-head sanitized evidence
        id: validate
        if: always() && steps.plan.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_PATH}"
          test ! -L "${EVIDENCE_PATH}"
          test "$(stat -c '%s' "${EVIDENCE_PATH}")" -le 131072
          install -d -m 0700 ../evidence-stage
          install -m 0600 -- "${EVIDENCE_PATH}" ../evidence-stage/reviewed-application.json
          test -f ../evidence-stage/reviewed-application.json
          test ! -L ../evidence-stage/reviewed-application.json
          test "$(stat -c '%s' ../evidence-stage/reviewed-application.json)" -le 131072
          python3 ../verifier/scripts/migration-readiness.py validate-evidence \
            --evidence ../evidence-stage/reviewed-application.json --tier pre-release \
            --task "${TASK}" --revision "${EXPECTED_SHA}"
      - name: Upload only bounded diagnostic JSON evidence
        if: always() && steps.plan.outcome == 'success' && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-application-${{ inputs.task }}-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-stage/reviewed-application.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Reject failed execution or invalid evidence
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          test "${EXECUTION_OUTCOME}" = success
          test "${EVIDENCE_OUTCOME}" = success

  aggregate:
    name: Fresh trusted exact-head application result
    needs: [admission, application]
    if: always() && github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASK: ${{ inputs.task }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Check out immutable shared admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ env.ADMISSION_REVISION }}
          path: admission
          persist-credentials: false
      - name: Recheck current PR head and both actors at final readback
        env:
          EXPECTED_REPOSITORY: Strukturpiloten/boxferry
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C admission rev-parse HEAD)" = "${ADMISSION_REVISION}"
          python3 admission/scripts/native-dispatch-admission.py
      - name: Reject failed, skipped, or cancelled prerequisite jobs
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          APPLICATION_RESULT: ${{ needs.application.result }}
        run: |
          set -euo pipefail
          test "${ADMISSION_RESULT}" = success
          test "${APPLICATION_RESULT}" = success
      - name: Check out trusted dispatcher revision for evidence validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out exact candidate for independent catalogue readback
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          path: candidate
          persist-credentials: false
      - name: Repeat trusted catalogue admission at final readback
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_SHA}"
          python3 trusted/scripts/reviewed-application-catalogue.py \
            --trusted-root trusted --candidate-root candidate --verifier-root verifier \
            --task "${TASK}"
      - name: Download the exact task evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-application-${{ inputs.task }}-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Revalidate exact candidate and bounded evidence from trusted code
        run: |
          set -euo pipefail
          python3 verifier/scripts/migration-readiness.py validate-evidence \
            --evidence evidence/reviewed-application.json --tier pre-release \
            --task "${TASK}" --revision "${EXPECTED_SHA}" --require-success
