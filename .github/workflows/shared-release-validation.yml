---
name: Shared Rust release validation

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact caller revision tested in this run.
        required: true
        type: string
      automation_sha:
        description: Immutable BoxFerry commit; must equal this workflow call's SHA ref.
        required: true
        type: string
      policy_sha:
        description: Trusted PR or merge queue base, otherwise the candidate SHA.
        required: true
        type: string
      config_path:
        description: Repository-relative JSON policy path in the trusted policy revision.
        required: true
        type: string
      needs_json:
        description: JSON of every prerequisite with candidate bindings and one published API proof.
        required: true
        type: string
    outputs:
      candidate_sha:
        description: Exact candidate with every required release prerequisite successful.
        value: ${{ jobs.validate.outputs.candidate_sha }}
      published_api_candidate_sha:
        description: Exact candidate with one validated published-purpose API prerequisite.
        value: ${{ jobs.validate.outputs.published_api_candidate_sha }}

permissions:
  contents: read

jobs:
  validate:
    name: Complete exact-candidate release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.result.outputs.candidate_sha }}
      published_api_candidate_sha: ${{ steps.gate.outputs.published_api_candidate_sha }}
    steps:
      - name: Check out immutable shared automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          ref: ${{ inputs.automation_sha }}
          path: _automation
          persist-credentials: false
      - name: Bind caller candidate and trusted policy
        id: source
        uses: ./_automation/.github/actions/shared-source
        with:
          candidate-sha: ${{ inputs.candidate_sha }}
          automation-sha: ${{ inputs.automation_sha }}
          policy-sha: ${{ inputs.policy_sha }}
          config-path: ${{ inputs.config_path }}
      - name: Install the locked shared Python project
        uses: ./_automation/.github/actions/shared-python
      - name: Require all repository-owned release prerequisites
        id: gate
        shell: bash
        env:
          POLICY_CONFIG: ${{ steps.source.outputs.config }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
          NEEDS_JSON: ${{ inputs.needs_json }}
        run: |
          set -euo pipefail
          uv run --locked --project _automation/automation python -m boxferry_ci.release gate \
            --repository-root source --config "${POLICY_CONFIG}" \
            --candidate-sha "${CANDIDATE_SHA}" --automation-sha "${AUTOMATION_SHA}" \
            --needs-json "${NEEDS_JSON}"
      - name: Expose successful candidate binding
        id: result
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: printf 'candidate_sha=%s\n' "${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
