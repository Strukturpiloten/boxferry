name: Docker runtime conformance

on:
  schedule:
    - cron: "43 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: Current Docker Engine / reviewed API bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: docker-runtime-conformance-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install configured Rust toolchain
        run: rustup show active-toolchain
      - name: Check disposable outer engine
        run: docker info
      - name: Decode reviewed API responses from exact nested Docker Engine
        env:
          BOXFERRY_CONTAINER_ENGINE: docker
        run: cargo ci-docker-conformance
