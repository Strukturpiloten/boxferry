name: Podman runtime conformance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      podman-version:
        description: Exact available runtime lane, or all lanes
        required: true
        default: all
        type: choice
        options:
          - all
          - 5.4.0
          - 5.5.2
          - 5.6.2
          - 5.7.1
          - 5.8.2

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: Podman ${{ matrix.podman-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: podman-runtime-conformance-${{ github.ref }}-${{ matrix.podman-version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        podman-version:
          - 5.4.0
          - 5.5.2
          - 5.6.2
          - 5.7.1
          - 5.8.2
    steps:
      - name: Check out repository
        if: >-
          github.event_name == 'schedule' ||
          inputs.podman-version == 'all' ||
          inputs.podman-version == matrix.podman-version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install configured Rust toolchain
        if: >-
          github.event_name == 'schedule' ||
          inputs.podman-version == 'all' ||
          inputs.podman-version == matrix.podman-version
        run: rustup show active-toolchain
      - name: Check disposable outer engine
        if: >-
          github.event_name == 'schedule' ||
          inputs.podman-version == 'all' ||
          inputs.podman-version == matrix.podman-version
        run: docker info
      - name: Decode inspection from the exact nested Podman runtime
        if: >-
          github.event_name == 'schedule' ||
          inputs.podman-version == 'all' ||
          inputs.podman-version == matrix.podman-version
        env:
          BOXFERRY_CONTAINER_ENGINE: docker
          BOXFERRY_PODMAN_RUNTIME_VERSION: ${{ matrix.podman-version }}
        run: cargo ci-podman-conformance
