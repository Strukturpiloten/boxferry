---
name: Podman live conformance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed matrix lane to run on the GitHub-hosted disposable runner.
        required: true
        default: full-container
        type: choice
        options:
          - smoke
          - full-container
          - paperless-capture
          - immich-capture

permissions:
  contents: read

concurrency:
  group: podman-live-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Select reviewed cells
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
      profile: ${{ steps.cells.outputs.profile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select exact matrix cells
        id: cells
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.profile }}
        run: |
          set -Eeuo pipefail
          if [[ "${PROFILE}" == smoke ]]; then
            cells="$(awk -F '\t' '
              $1 == "podman-5.4-rootless" ||
              $1 == "podman-6.1-rootful" ||
              $1 == "podman-6.1-rootless" ||
              $1 == "podman-debian-11-rootful" ||
              $1 == "podman-debian-11-rootless" ||
              $1 == "podman-debian-12-rootful" ||
              $1 == "podman-ubi-8-rootful" ||
              $1 == "podman-ubuntu-22.04-rootless" ||
              $1 == "podman-ubuntu-24.04-rootless" { print $1 }
            ' fixtures/conformance/podman-live/matrix.tsv)"
          elif [[ "${PROFILE}" == paperless-capture || "${PROFILE}" == immich-capture ]]; then
            cells="podman-6.1-rootless"
          else
            cells="$(awk -F '\t' '$1 !~ /^#/ && $6 == "container" { print $1 }' fixtures/conformance/podman-live/matrix.tsv)"
          fi
          json="$(jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))' <<< "${cells}")"
          [[ "$(jq 'length' <<< "${json}")" -gt 0 ]]
          printf 'cells=%s\n' "${json}" >> "${GITHUB_OUTPUT}"
          printf 'profile=%s\n' "${PROFILE}" >> "${GITHUB_OUTPUT}"

  build-boxferry:
    name: Build BoxFerry once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build BoxFerry
        run: cargo build --locked --package boxferry --bin boxferry --features podman
      - name: Upload BoxFerry binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boxferry-live-binary
          path: target/debug/boxferry
          if-no-files-found: error
          retention-days: 1

  conformance:
    name: ${{ needs.matrix.outputs.profile }} / ${{ matrix.cell }}
    # Nested privileged containers execute only reviewed image names. Fork changes cannot alter a
    # privileged GitHub-hosted runner. The job receives no secrets and never mounts a host socket.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      needs.matrix.outputs.profile != 'paperless-capture' &&
      needs.matrix.outputs.profile != 'immich-capture' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: [matrix, build-boxferry]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.cells) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.matrix.outputs.profile == 'smoke' && 10 || 120 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install outer Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap2-bin podman
      - name: Download BoxFerry binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boxferry-live-binary
          path: target/debug
      - name: Restore executable permission
        run: chmod +x target/debug/boxferry
      - name: Run the checked-in live conformance runner
        env:
          PROFILE: ${{ needs.matrix.outputs.profile }}
          BOXFERRY_BIN: ${{ github.workspace }}/target/debug/boxferry
          MATRIX_CELL: ${{ matrix.cell }}
        run: sudo env BOXFERRY_BIN="${BOXFERRY_BIN}" bash scripts/podman-live-conformance.sh --profile "${PROFILE}" --matrix-cell "${MATRIX_CELL}" --engine podman

  application:
    name: Nextcloud application / podman-6.1-rootless
    # Match the privileged conformance trust boundary: fork-authored code never reaches this runner.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build-boxferry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install outer Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap2-bin podman
      - name: Download BoxFerry binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boxferry-live-binary
          path: target/debug
      - name: Restore executable permission
        run: chmod +x target/debug/boxferry
      - name: Download and verify Docker Compose provider
        env:
          COMPOSE_URL: https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64
          COMPOSE_SHA256: c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b
        run: |
          set -Eeuo pipefail
          mkdir -p target/tools
          curl --fail --location --retry 3 --output target/tools/docker-compose "${COMPOSE_URL}"
          printf '%s  %s\n' "${COMPOSE_SHA256}" target/tools/docker-compose | sha256sum --check --strict
          chmod +x target/tools/docker-compose
      - name: Run checked-in Nextcloud application profile
        env:
          BOXFERRY_BIN: ${{ github.workspace }}/target/debug/boxferry
          BOXFERRY_COMPOSE_BIN: ${{ github.workspace }}/target/tools/docker-compose
        run: >-
          sudo env BOXFERRY_BIN="${BOXFERRY_BIN}" BOXFERRY_COMPOSE_BIN="${BOXFERRY_COMPOSE_BIN}"
          bash scripts/podman-live-conformance.sh --profile application
          --matrix-cell podman-6.1-rootless --engine podman

  forgejo-application:
    name: Forgejo application / Podman 6.1 Arch rootful and rootless
    # Match the privileged conformance trust boundary: fork-authored code never reaches this runner.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build-boxferry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install outer Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap2-bin podman
      - name: Download BoxFerry binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boxferry-live-binary
          path: target/debug
      - name: Restore executable permission
        run: chmod +x target/debug/boxferry
      - name: Download and verify Docker Compose provider
        env:
          COMPOSE_URL: https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64
          COMPOSE_SHA256: c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b
        run: |
          set -Eeuo pipefail
          mkdir -p target/tools
          curl --fail --location --retry 3 --output target/tools/docker-compose "${COMPOSE_URL}"
          printf '%s %s\n' "${COMPOSE_SHA256}" target/tools/docker-compose | sha256sum --check --strict
          chmod +x target/tools/docker-compose
      - name: Run checked-in Forgejo application profile
        env:
          BOXFERRY_BIN: ${{ github.workspace }}/target/debug/boxferry
          BOXFERRY_COMPOSE_BIN: ${{ github.workspace }}/target/tools/docker-compose
        run: >-
          sudo env BOXFERRY_BIN="${BOXFERRY_BIN}" BOXFERRY_COMPOSE_BIN="${BOXFERRY_COMPOSE_BIN}"
          bash scripts/podman-live-conformance.sh --profile forgejo-application --engine podman

  paperless-application:
    name: Paperless-ngx application / podman-6.1-rootless
    # Match the privileged conformance trust boundary: fork-authored code never reaches the runner.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event_name == 'workflow_dispatch' && inputs.profile == 'paperless-capture'
    needs: [matrix, build-boxferry]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install outer Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap2-bin podman
      - name: Download BoxFerry binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boxferry-live-binary
          path: target/debug
      - name: Restore executable permission
        run: chmod +x target/debug/boxferry
      - name: Download and verify Docker Compose provider
        env:
          COMPOSE_URL: https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64
          COMPOSE_SHA256: c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b
        run: |
          set -Eeuo pipefail
          mkdir -p target/tools
          curl --fail --location --retry 3 --output target/tools/docker-compose "${COMPOSE_URL}"
          printf '%s %s\n' "${COMPOSE_SHA256}" target/tools/docker-compose | sha256sum --check --strict
          chmod +x target/tools/docker-compose
      - name: Run checked-in Paperless-ngx application profile
        env:
          BOXFERRY_BIN: ${{ github.workspace }}/target/debug/boxferry
          BOXFERRY_COMPOSE_BIN: ${{ github.workspace }}/target/tools/docker-compose
          BOXFERRY_PAPERLESS_CAPTURE_DIRECTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'paperless-capture' && format('{0}/paperless-capture-parent/candidate', runner.temp) || '' }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${BOXFERRY_PAPERLESS_CAPTURE_DIRECTORY}" ]]; then
            install -d -m 0700 "${RUNNER_TEMP}/paperless-capture-parent"
          fi
          sudo env BOXFERRY_BIN="${BOXFERRY_BIN}" BOXFERRY_COMPOSE_BIN="${BOXFERRY_COMPOSE_BIN}" \
          BOXFERRY_PAPERLESS_CAPTURE_DIRECTORY="${BOXFERRY_PAPERLESS_CAPTURE_DIRECTORY}" \
          bash scripts/podman-live-conformance.sh --profile paperless-application \
          --matrix-cell podman-6.1-rootless --engine podman
      - name: Upload sanitized Paperless native capture candidate
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'paperless-capture' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperless-native-capture-candidate
          path: ${{ runner.temp }}/paperless-capture-parent/candidate
          if-no-files-found: error
          retention-days: 1

  immich-application:
    name: Immich application / podman-6.1-rootless
    # Match the privileged conformance trust boundary: fork-authored code never reaches this job.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event_name == 'workflow_dispatch' && inputs.profile == 'immich-capture'
    needs: build-boxferry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install outer Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap2-bin podman
      - name: Download BoxFerry binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boxferry-live-binary
          path: target/debug
      - name: Restore executable permission
        run: chmod +x target/debug/boxferry
      - name: Download and verify Docker Compose provider
        env:
          COMPOSE_URL: https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64
          COMPOSE_SHA256: c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b
        run: |
          mkdir -p target/tools
          curl --fail --location --retry 3 --output target/tools/docker-compose "${COMPOSE_URL}"
          printf '%s  %s\n' "${COMPOSE_SHA256}" target/tools/docker-compose | sha256sum --check --strict
          chmod +x target/tools/docker-compose
      - name: Run checked-in Immich application profile
        env:
          BOXFERRY_BIN: ${{ github.workspace }}/target/debug/boxferry
          BOXFERRY_COMPOSE_BIN: ${{ github.workspace }}/target/tools/docker-compose
          BOXFERRY_IMMICH_CAPTURE_DIRECTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'immich-capture' && format('{0}/immich-capture-parent/candidate', runner.temp) || '' }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${BOXFERRY_IMMICH_CAPTURE_DIRECTORY}" ]]; then
            install -d -m 0700 "${RUNNER_TEMP}/immich-capture-parent"
          fi
          sudo env \
            BOXFERRY_BIN="${BOXFERRY_BIN}" \
            BOXFERRY_COMPOSE_BIN="${BOXFERRY_COMPOSE_BIN}" \
            BOXFERRY_IMMICH_CAPTURE_DIRECTORY="${BOXFERRY_IMMICH_CAPTURE_DIRECTORY}" \
            bash scripts/podman-live-conformance.sh --profile immich-application \
              --matrix-cell podman-6.1-rootless --engine podman
      - name: Upload sanitized Immich native capture candidate
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'immich-capture' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immich-native-capture-candidate
          path: ${{ runner.temp }}/immich-capture-parent/candidate
          if-no-files-found: error
          retention-days: 1
