name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install configured Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo ci-check
      - name: Check facade feature boundaries
        run: |
          cargo ci-core
          cargo ci-compose
          cargo ci-docker
          cargo ci-quadlet
          cargo ci-podman
          cargo ci-runtime
      - name: Check repository policies
        run: cargo ci-policy
      - name: Run Clippy
        run: cargo ci-clippy
      - name: Run tests
        run: cargo ci-test
      - name: Run documentation tests
        run: cargo ci-doctest
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo ci-doc

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        run: cargo install --locked --version 0.8.7 cargo-llvm-cov
      - name: Measure and enforce coarse coverage ratchet
        run: >-
          cargo llvm-cov --locked --workspace --all-features --all-targets --summary-only
          --fail-under-regions 82 --fail-under-functions 87 --fail-under-lines 82

  portability:
    name: Portability (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Check all deterministic targets
        run: cargo ci-check
      - name: Run deterministic tests
        run: cargo ci-test

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Read the workspace MSRV
        id: metadata
        shell: bash
        run: |
          msrv="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '[.packages[].rust_version] | unique | if length == 1 and .[0] != null then .[0] else error("workspace packages must declare one common rust-version") end'
          )"
          printf 'msrv=%s\n' "$msrv" >> "$GITHUB_OUTPUT"
      - name: Install minimum supported Rust
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: rustup toolchain install "${RUST_MSRV}" --profile minimal
      - name: Check all targets with the MSRV
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-check
      - name: Check repository policies with the MSRV
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-policy

  dependencies:
    name: Dependency and license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Audit dependencies, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  documentation:
    name: Repository files and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Node file-quality tools
        run: |
          npm ci --ignore-scripts
          printf '%s\n' "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Install checksum-pinned native file-quality tools
        run: |
          sudo bash scripts/install-file-tools.sh /usr/local/bin
      - name: Check non-Rust file formatting and lint
        run: bash scripts/check-files.sh --check
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir '${{ github.workspace }}' --no-progress --max-retries 2
            --retry-wait-time 2 --accept '100..=103,200..=299,429'
            --exclude-path '(^|/)target/' './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  semver:
    name: SemVer (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - boxferry-model
          - boxferry-engine
          - boxferry-compose
          - boxferry-quadlet
          - boxferry-runtime
          - boxferry-docker
          - boxferry-podman
          - boxferry
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a published baseline
        id: baseline
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          status="$(
            curl --proto '=https' \
              --tlsv1.2 \
              --silent \
              --show-error \
              --user-agent 'BoxFerry CI (+https://github.com/Strukturpiloten/boxferry)' \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${PACKAGE}"
          )"
          case "${status}" in
            200) echo 'published=true' >> "${GITHUB_OUTPUT}" ;;
            404) echo 'published=false' >> "${GITHUB_OUTPUT}" ;;
            *) echo "Unexpected crates.io response: HTTP ${status}." >&2; exit 1 ;;
          esac
      - name: Check public API compatibility
        if: steps.baseline.outputs.published == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: ${{ matrix.package }}
          feature-group: all-features

  pr-gate:
    name: PR gate
    if: always()
    needs: [rust, msrv, dependencies, documentation, semver, coverage, portability]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every deterministic PR job to succeed
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          SEMVER_RESULT: ${{ needs.semver.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
        run: |
          set -euo pipefail
          jobs=(
            "Rust quality|${RUST_RESULT}"
            "MSRV|${MSRV_RESULT}"
            "Dependency and license policy|${DEPENDENCIES_RESULT}"
            "Documentation|${DOCUMENTATION_RESULT}"
            "SemVer|${SEMVER_RESULT}"
            "Coverage ratchet|${COVERAGE_RESULT}"
            "macOS portability|${PORTABILITY_RESULT}"
          )

          {
            printf '## Required PR job results\n\n'
            printf '| Job | Result |\n'
            printf '| --- | --- |\n'
          } >> "${GITHUB_STEP_SUMMARY}"

          failures=0
          for job in "${jobs[@]}"; do
            name="${job%%|*}"
            result="${job#*|}"
            printf "| %s | \`%s\` |\n" "${name}" "${result}" >> "${GITHUB_STEP_SUMMARY}"
            printf 'Required PR job %s: %s\n' "${name}" "${result}"
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Required PR job did not succeed::${name} concluded ${result}."
              echo "Required PR job did not succeed: ${name} concluded ${result}." >&2
              failures=1
            fi
          done

          if (( failures != 0 )); then
            echo 'One or more required PR jobs did not succeed; see the result table and annotations above.' >&2
            exit 1
          fi
