---
name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validation-plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      select_rust: ${{ steps.plan.outputs.select_rust }}
      select_msrv: ${{ steps.plan.outputs.select_msrv }}
      select_dependencies: ${{ steps.plan.outputs.select_dependencies }}
      select_documentation: ${{ steps.plan.outputs.select_documentation }}
      select_release_metadata: ${{ steps.plan.outputs.select_release_metadata }}
      select_semver_release_type: ${{ steps.plan.outputs.select_semver_release_type }}
      select_semver: ${{ steps.plan.outputs.select_semver }}
      select_coverage: ${{ steps.plan.outputs.select_coverage }}
      select_migration_readiness: ${{ steps.plan.outputs.select_migration_readiness }}
      select_lockfile_release_age: ${{ steps.plan.outputs.select_lockfile_release_age }}
    steps:
      - name: Check out exact tested revision and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted PR base validation policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .validation-base
          persist-credentials: false
      - name: Select exact-revision validation plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
            if [[ -f .validation-base/scripts/validation-plan.py &&
                  -f .validation-base/scripts/validation-policy.json ]]; then
              python3 .validation-base/scripts/validation-plan.py plan \
                --repository-root "${GITHUB_WORKSPACE}" \
                --policy-root .validation-base \
                --event pull_request --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" \
                --tested-sha "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}"
            else
              # First rollout: never execute a PR-head classifier without trusted base policy.
              python3 - <<'PY'
          import json
          import os
          import re

          jobs = "rust msrv dependencies documentation release-metadata semver-release-type semver coverage migration-readiness lockfile-release-age".split()
          base, head, tested = (os.environ[key] for key in ("BASE_SHA", "HEAD_SHA", "GITHUB_SHA"))
          if any(not re.fullmatch(r"[0-9a-f]{40}", value) for value in (base, head, tested)):
              raise SystemExit("first-rollout comparison has an invalid SHA")
          plan = {"schema": 2, "repository": "Strukturpiloten/boxferry", "event": "pull_request",
                  "base_sha": base, "head_sha": head, "tested_sha": tested, "profile": "full",
                  "jobs": {job: True for job in jobs}, "reasons": ["trusted base has no classifier"],
                  "local_fingerprint": None}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("plan=" + json.dumps(plan, sort_keys=True, separators=(",", ":")) + "\nprofile=full\n")
              for job in jobs:
                  output.write("select_" + job.replace("-", "_") + "=true\n")
          PY
            fi
          else
            python3 scripts/validation-plan.py plan --event "${EVENT_NAME}" \
              --tested-sha "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi

  rust:
    name: Rust quality
    needs: validation-plan
    if: needs.validation-plan.outputs.select_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install configured Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo ci-check
      - name: Check facade feature boundaries
        run: |
          cargo ci-core
          cargo ci-compose
          cargo ci-podman
          cargo ci-quadlet
      - name: Check repository policies
        run: cargo ci-policy
      - name: Run Clippy
        run: cargo ci-clippy
      - name: Run tests
        run: cargo ci-test
      - name: Run documentation tests
        run: cargo ci-doctest
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo ci-doc

  coverage:
    name: Coverage ratchet
    needs: validation-plan
    if: needs.validation-plan.outputs.select_coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        # renovate: datasource=crate depName=cargo-llvm-cov
        run: cargo install --locked --version 0.9.0 cargo-llvm-cov
      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --locked
      - name: Measure and enforce coarse coverage ratchet
        run: >-
          cargo llvm-cov --locked --no-clean --workspace --all-features --all-targets --summary-only
          --fail-under-regions 82 --fail-under-functions 87 --fail-under-lines 82

  msrv:
    name: MSRV
    needs: validation-plan
    if: needs.validation-plan.outputs.select_msrv == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Read the workspace MSRV
        id: metadata
        shell: bash
        run: |
          msrv="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '[.packages[].rust_version] | unique | if length == 1 and .[0] != null then .[0] else error("workspace packages must declare one common rust-version") end'
          )"
          printf 'msrv=%s\n' "$msrv" >> "$GITHUB_OUTPUT"
      - name: Install minimum supported Rust
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: rustup toolchain install "${RUST_MSRV}" --profile minimal
      - name: Check all targets with the MSRV
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-check
      - name: Check repository policies with the MSRV
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-policy

  dependencies:
    name: Dependency and license policy
    needs: validation-plan
    if: needs.validation-plan.outputs.select_dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Audit dependencies, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  documentation:
    name: Repository files and documentation
    needs: validation-plan
    if: needs.validation-plan.outputs.select_documentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Node file-quality tools
        run: |
          npm ci --ignore-scripts
          printf '%s\n' "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Install checksum-pinned native file-quality tools
        run: |
          sudo bash scripts/install-file-tools.sh /usr/local/bin
      - name: Check non-Rust file formatting and lint
        run: bash scripts/check-files.sh --check
      - name: Test validation-plan regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-validation-plan.py
      - name: Test executable documentation without duplicating the full Rust suite
        if: fromJSON(needs.validation-plan.outputs.plan).profile == 'executable-docs'
        run: cargo test --locked --package boxferry --all-features --test documentation_examples
      - name: Check local documentation links without network access
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --root-dir '${{ github.workspace }}' --offline
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release-metadata:
    name: Release metadata and changelog
    needs: validation-plan
    if: needs.validation-plan.outputs.select_release_metadata == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate current-version release metadata and changelog
        run: bash scripts/validate-release-metadata.sh

  semver-release-type:
    name: SemVer release type
    needs: validation-plan
    if: needs.validation-plan.outputs.select_semver_release_type == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_type: ${{ steps.classify.outputs.release_type }}
    steps:
      - *checkout
      - name: Classify an intentional public break
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SEMVER_CHANGE_SUBJECT: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request) subject="${SEMVER_CHANGE_SUBJECT}" ;;
            push | workflow_dispatch) subject="$(git log -1 --format=%s)" ;;
            *)
              printf 'Unsupported CI event for SemVer classification: %s\n' "${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          subject="${subject%%$'\n'*}"

          readonly breaking_change_title_pattern='^(feat|fix|perf|refactor|revert)(\([^)]+\))?!: .+$'
          if [[ "${subject}" =~ ${breaking_change_title_pattern} ]]; then
            printf 'release_type=major\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'release_type=\n' >> "${GITHUB_OUTPUT}"
          fi

  semver:
    name: SemVer (${{ matrix.package }})
    needs: [validation-plan, semver-release-type]
    if: needs.validation-plan.outputs.select_semver == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - boxferry-model
          - boxferry-engine
          - boxferry-compose
          - boxferry-podman
          - boxferry-quadlet
          - boxferry
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a published baseline
        id: baseline
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          status="$(
            curl --proto '=https' \
              --tlsv1.2 \
              --silent \
              --show-error \
              --user-agent 'BoxFerry CI (+https://github.com/Strukturpiloten/boxferry)' \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${PACKAGE}"
          )"
          case "${status}" in
            200) echo 'published=true' >> "${GITHUB_OUTPUT}" ;;
            404) echo 'published=false' >> "${GITHUB_OUTPUT}" ;;
            *) echo "Unexpected crates.io response: HTTP ${status}." >&2; exit 1 ;;
          esac
      - name: Check public API compatibility
        if: steps.baseline.outputs.published == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: ${{ matrix.package }}
          feature-group: all-features
          release-type: ${{ needs.semver-release-type.outputs.release_type }}

  migration-readiness:
    name: Offline migration readiness
    needs: validation-plan
    if: needs.validation-plan.outputs.select_migration_readiness == 'true'
    runs-on: ubuntu-24.04
    # The 20-minute catalogue deadline leaves ten minutes for checkout and evidence handling.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run shared offline tier
        run: >-
          python3 scripts/migration-readiness.py run
          --tier offline
          --revision "${GITHUB_SHA}"
          --evidence target/migration-readiness/evidence-v2.json
      - name: Validate exact-revision evidence
        if: always() && hashFiles('target/migration-readiness/evidence-v2.json') != ''
        run: >-
          python3 scripts/migration-readiness.py validate-evidence
          --evidence target/migration-readiness/evidence-v2.json
          --tier offline
          --revision "${GITHUB_SHA}"
          --require-success
      - name: Upload bounded offline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-readiness-offline-${{ github.sha }}-${{ github.run_id }}
          path: target/migration-readiness/evidence-v2.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  lockfile-release-age:
    name: Lockfile release age
    needs: validation-plan
    if: needs.validation-plan.outputs.select_lockfile_release_age == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve the aggregate result outside pull requests
        if: github.event_name != 'pull_request'
        run: echo 'Lockfile release-age comparison applies to pull requests.'
      - name: Check out the exact pull-request candidate and base history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the shared lockfile policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/.github
          # renovate: datasource=github-digest depName=Strukturpiloten/.github currentValue=main
          ref: a9e003816709ccac55e761e5ef8a884d4359c853
          path: .github/strukturpiloten-shared
          persist-credentials: false
      - name: Reject newly introduced dependencies younger than three days
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 .github/strukturpiloten-shared/scripts/lockfile_release_age.py
          --repository-root "${GITHUB_WORKSPACE}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
          --minimum-age-hours 72

  pr-gate:
    name: PR gate
    if: always()
    needs:
      [
        validation-plan,
        rust,
        msrv,
        dependencies,
        documentation,
        release-metadata,
        semver-release-type,
        semver,
        coverage,
        migration-readiness,
        lockfile-release-age,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate aggregate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out trusted PR base aggregate verifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .validation-base
          persist-credentials: false
      - name: Require every selected job to succeed and every skip to be planned
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_JSON: ${{ needs.validation-plan.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'pull_request' &&
                ( ! -f .validation-base/scripts/validation-plan.py ||
                  ! -f .validation-base/scripts/validation-policy.json ) ]]; then
            # Bootstrap has no trusted verifier. Require the literal complete plan and all jobs.
            python3 - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os

          jobs = "rust msrv dependencies documentation release-metadata semver-release-type semver coverage migration-readiness lockfile-release-age".split()
          plan = json.loads(os.environ["PLAN_JSON"])
          needs = json.loads(os.environ["NEEDS_JSON"])
          if (set(plan) != {"schema", "repository", "event", "base_sha", "head_sha", "tested_sha",
                            "profile", "jobs", "reasons", "local_fingerprint"}
                  or plan["schema"] != 2 or plan["repository"] != "Strukturpiloten/boxferry"
                  or plan["event"] != "pull_request" or plan["profile"] != "full"
                  or plan["base_sha"] != os.environ["BASE_SHA"]
                  or plan["head_sha"] != os.environ["HEAD_SHA"]
                  or plan["tested_sha"] != os.environ["GITHUB_SHA"]
                  or plan["jobs"] != {job: True for job in jobs}
                  or set(needs) != {"validation-plan", *jobs}):
              raise SystemExit("first-rollout complete validation contract is missing or inconsistent")
          for job in ("validation-plan", *jobs):
              if needs[job].get("result") != "success":
                  raise SystemExit(f"first-rollout required job {job} did not succeed")
          print("First-rollout complete validation: every required job succeeded")
          PY
          else
            verifier=scripts/validation-plan.py
            policy_root=.
            if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
              verifier=.validation-base/scripts/validation-plan.py
              policy_root=.validation-base
            fi
            python3 "${verifier}" gate --policy-root "${policy_root}" \
              --event "${EVENT_NAME}" --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" \
              --tested-sha "${GITHUB_SHA}" \
              --plan-json "${PLAN_JSON}" --needs-json "${NEEDS_JSON}" |
              tee -a "${GITHUB_STEP_SUMMARY}"
          fi
