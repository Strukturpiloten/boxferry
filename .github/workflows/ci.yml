---
name: CI

on:
  workflow_call:
    inputs:
      api_purpose:
        description: Reusable CI defaults to strict published API validation.
        type: string
        default: published
    outputs:
      published_api_candidate_sha:
        description: Exact candidate with published API success across the complete SemVer matrix.
        value: ${{ jobs.semver.outputs.published_api_candidate_sha }}
      release_binary_artifact:
        description: Verified CLI archive set for the exact candidate and run.
        value: ${{ jobs.release-binaries.outputs.release_binary_artifact }}
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-binaries:
    name: Build and verify release binaries
    uses: ./.github/workflows/release-binaries.yml

  automation:
    name: Shared automation package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact shared package candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _automation
          persist-credentials: false
      - name: Install the canonical locked Python toolchain
        uses: ./_automation/.github/actions/shared-python
      - &node_toolchain
        name: Install pinned Node.js toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      # Candidate validation only; this is not an admitted-source receipt.
      - name: Validate candidate shared Node composite
        uses: ./_automation/.github/actions/shared-node
        with:
          automation-sha: ${{ github.sha }}
          cache: ""
      - name: Check Python formatting
        run: uv run --locked --project _automation/automation ruff format --check _automation/automation
      - name: Lint Python
        run: uv run --locked --project _automation/automation ruff check _automation/automation
      - name: Check Python types
        run: uv run --locked --project _automation/automation ty check --project _automation/automation
      - name: Prepare the integrity-pinned native Renovate test runtime
        run: >-
          uv run --locked --project _automation/automation python -m boxferry_ci.renovate_runtime
          --engine docker --pin _automation/automation/renovate-runtime.json
          --destination _automation/target/tools/renovate
      - name: Test shared automation failure contracts
        env:
          BOXFERRY_RENOVATE_PACKAGE: ${{ github.workspace }}/_automation/target/tools/renovate
        run: uv run --locked --project _automation/automation python -m boxferry_ci.test_reporting --repository-root _automation --start-directory _automation/automation/tests

  canonical-artifact-integrity:
    name: Canonical tool artifact integrity
    runs-on: ubuntu-24.04
    # The 600-second checker budget leaves five minutes for checkout and Python setup.
    timeout-minutes: 15
    steps:
      - name: Check out the exact artifact policy candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _automation
          persist-credentials: false
      - name: Install the canonical locked Python toolchain
        uses: ./_automation/.github/actions/shared-python
      - name: Verify all fourteen candidate tool and uv artifact bytes
        env:
          CANONICAL_CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          uv run --locked --project _automation/automation python -m boxferry_ci.asset_verification
          --repository-root _automation --candidate-sha "${CANONICAL_CANDIDATE_SHA}"

  kubernetes-artifact-integrity:
    name: Kubernetes tool artifact integrity
    runs-on: ubuntu-24.04
    # The 720-second checker budget leaves five minutes for checkout and Python setup.
    timeout-minutes: 17
    steps:
      - name: Check out the exact artifact policy candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _automation
          persist-credentials: false
      - name: Install the canonical locked Python toolchain
        uses: ./_automation/.github/actions/shared-python
      - name: Verify all eight candidate Kubernetes tool artifact bytes
        run: >-
          uv run --locked --project _automation/automation python _automation/scripts/kubernetes_tool_checksum_refresh.py
          --verify-git-ref "${GITHUB_SHA}" --repository-root _automation

  compose-provider-integrity:
    name: Compose provider artifact integrity
    runs-on: ubuntu-24.04
    # The 720-second checker budget leaves five minutes for checkout and Python setup.
    timeout-minutes: 17
    steps:
      - name: Check out the exact artifact policy candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _automation
          persist-credentials: false
      - name: Install the canonical locked Python toolchain
        uses: ./_automation/.github/actions/shared-python
      - name: Verify the candidate Compose provider artifact bytes
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          uv run --locked --project _automation/automation python -m boxferry_ci.compose_provider
          --repository-root _automation --candidate-sha "${CANDIDATE_SHA}"

  validation-plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      select_rust: ${{ steps.plan.outputs.select_rust }}
      select_msrv: ${{ steps.plan.outputs.select_msrv }}
      select_dependencies: ${{ steps.plan.outputs.select_dependencies }}
      select_documentation: ${{ steps.plan.outputs.select_documentation }}
      select_release_metadata: ${{ steps.plan.outputs.select_release_metadata }}
      select_semver_release_type: ${{ steps.plan.outputs.select_semver_release_type }}
      select_semver: ${{ steps.plan.outputs.select_semver }}
      select_coverage: ${{ steps.plan.outputs.select_coverage }}
      select_migration_readiness: ${{ steps.plan.outputs.select_migration_readiness }}
      select_lockfile_release_age: ${{ steps.plan.outputs.select_lockfile_release_age }}
    steps:
      - name: Check out exact tested revision and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted PR base validation policy
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: .validation-base
          persist-credentials: false
      - name: Select exact-revision validation plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'pull_request' || "${EVENT_NAME}" == 'merge_group' ]]; then
            if [[ "${EVENT_NAME}" == 'pull_request' && -f .validation-base/scripts/validation-plan.py &&
                  -f .validation-base/scripts/validation-policy.json ]]; then
              python3 .validation-base/scripts/validation-plan.py plan \
                --repository-root "${GITHUB_WORKSPACE}" \
                --policy-root .validation-base \
                --event pull_request --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" \
                --tested-sha "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}"
            else
              # First rollout: never execute a PR-head classifier without trusted base policy.
              python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          jobs = "rust msrv dependencies documentation release-metadata semver-release-type semver coverage migration-readiness lockfile-release-age".split()
          base, head, tested = (os.environ[key] for key in ("BASE_SHA", "HEAD_SHA", "GITHUB_SHA"))
          if any(not re.fullmatch(r"[0-9a-f]{40}", value) for value in (base, head, tested)):
              raise SystemExit("first-rollout comparison has an invalid SHA")
          event = os.environ["EVENT_NAME"]
          if event not in {"pull_request", "merge_group"}:
              raise SystemExit("unsupported complete-bootstrap event")
          if event == "merge_group":
              if head != tested:
                  raise SystemExit("merge queue head does not match tested candidate")
              subprocess.run(["git", "merge-base", "--is-ancestor", base, tested], check=True)
          plan = {"schema": 2, "repository": "Strukturpiloten/boxferry", "event": event,
                  "base_sha": base, "head_sha": head, "tested_sha": tested, "profile": "full",
                  "jobs": {job: True for job in jobs}, "reasons": ["conservative complete bootstrap"],
                  "local_fingerprint": None}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("plan=" + json.dumps(plan, sort_keys=True, separators=(",", ":")) + "\nprofile=full\n")
              for job in jobs:
                  output.write("select_" + job.replace("-", "_") + "=true\n")
          PY
            fi
          else
            python3 scripts/validation-plan.py plan --event "${EVENT_NAME}" \
              --tested-sha "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi

  rust:
    name: Rust quality
    needs: validation-plan
    if: needs.validation-plan.outputs.select_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install configured Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo ci-check
      - name: Check facade feature boundaries
        run: |
          cargo ci-core
          cargo ci-compose
          cargo ci-podman
          cargo ci-quadlet
      - name: Check repository policies
        run: cargo ci-policy
      - name: Run Clippy
        run: cargo ci-clippy
      - name: Run tests
        run: cargo ci-test
      - name: Run documentation tests
        run: cargo ci-doctest
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo ci-doc

  coverage:
    name: Coverage ratchet
    needs: validation-plan
    if: needs.validation-plan.outputs.select_coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        # renovate: datasource=crate depName=cargo-llvm-cov
        run: cargo install --locked --version 0.9.0 cargo-llvm-cov
      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --locked
      - name: Measure and enforce coarse coverage ratchet
        run: >-
          cargo llvm-cov --locked --no-clean --workspace --all-features --all-targets --summary-only
          --fail-under-regions 82 --fail-under-functions 87 --fail-under-lines 82

  msrv:
    name: MSRV
    needs: validation-plan
    if: needs.validation-plan.outputs.select_msrv == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Read the workspace MSRV
        id: metadata
        shell: bash
        run: |
          msrv="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '[.packages[].rust_version] | unique | if length == 1 and .[0] != null then .[0] else error("workspace packages must declare one common rust-version") end'
          )"
          printf 'msrv=%s\n' "$msrv" >> "$GITHUB_OUTPUT"
      - name: Install minimum supported Rust
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: rustup toolchain install "${RUST_MSRV}" --profile minimal --no-self-update
      - name: Check all targets with the MSRV
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-check
      - name: Check repository policies with the MSRV
        env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-policy

  dependencies:
    name: Dependency and license policy
    needs: validation-plan
    if: needs.validation-plan.outputs.select_dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Audit dependencies, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Prepare nested dependency-action fixture
        run: cp -R automation/tests/fixtures/cargo-deny-action/source source
      - name: Audit nested dependency-action fixture with explicit policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: source/Cargo.toml
          command: check
          arguments: --all-features --config source/explicit-policy.toml

  documentation:
    name: Repository files and documentation
    needs: validation-plan
    if: needs.validation-plan.outputs.select_documentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node_toolchain
      - name: Install locked Node file-quality tools
        run: |
          npm ci --ignore-scripts
          printf '%s\n' "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Install checksum-pinned native file-quality tools
        run: |
          sudo bash scripts/install-file-tools.sh /usr/local/bin
      - name: Check non-Rust file formatting and lint
        run: bash scripts/check-files.sh --check
      - name: Test validation-plan regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-validation-plan.py
      - name: Test release binary archive contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-release-binaries.py
      - name: Test release emulator extraction
        run: bash scripts/test-release-emulator.sh
      - name: Test application probe contracts
        run: bash scripts/test-application-probes.sh
      - name: Test executable documentation without duplicating the full Rust suite
        if: fromJSON(needs.validation-plan.outputs.plan).profile == 'executable-docs'
        run: cargo test --locked --package boxferry --all-features --test documentation_examples
      - name: Check local documentation links without network access
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --root-dir '${{ github.workspace }}' --offline
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release-metadata:
    name: Release metadata and changelog
    needs: validation-plan
    if: needs.validation-plan.outputs.select_release_metadata == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release metadata contexts and structural checks
        run: bash scripts/test-release-metadata.sh
      - name: Validate current-version release metadata and changelog
        env:
          RELEASE_METADATA_MODE: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-') && '--release' || '--development' }}
        run: bash scripts/validate-release-metadata.sh "${RELEASE_METADATA_MODE}"

  semver-release-type:
    name: SemVer release type
    needs: validation-plan
    if: needs.validation-plan.outputs.select_semver_release_type == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_type: ${{ steps.classify.outputs.release_type }}
    steps:
      - *checkout
      - name: Classify an intentional public break
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SEMVER_CHANGE_SUBJECT: ${{ github.event.pull_request.title }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request) subject="${SEMVER_CHANGE_SUBJECT}" ;;
            push | workflow_dispatch) subject="$(git log -1 --format=%s)" ;;
            merge_group)
              PYTHONPATH=automation/src python3 -m boxferry_ci.release classify-queue \
                --repository-root . --candidate-sha "${GITHUB_SHA}" --automation-sha "${GITHUB_SHA}" \
                --queue-base-sha "${QUEUE_BASE_SHA}" --default-branch "${DEFAULT_BRANCH}"
              exit 0
              ;;
            *)
              printf 'Unsupported CI event for SemVer classification: %s\n' "${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          subject="${subject%%$'\n'*}"

          readonly breaking_change_title_pattern='^(feat|fix|perf|refactor|revert)(\([^)]+\))?!: .+$'
          if [[ "${subject}" =~ ${breaking_change_title_pattern} ]]; then
            printf 'release_type=major\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'release_type=\n' >> "${GITHUB_OUTPUT}"
          fi

  semver:
    name: SemVer (${{ matrix.package }})
    needs: [validation-plan, semver-release-type]
    if: needs.validation-plan.outputs.select_semver == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - boxferry-model
          - boxferry-engine
          - boxferry-compose
          - boxferry-podman
          - boxferry-quadlet
          - boxferry
    uses: ./.github/workflows/shared-rust-semver.yml
    with:
      candidate_sha: ${{ github.sha }}
      automation_sha: ${{ github.sha }}
      policy_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      config_path: scripts/validation-policy.json
      package: ${{ matrix.package }}
      api_purpose: ${{ inputs.api_purpose || 'development' }}
      release_type: ${{ inputs.api_purpose != 'published' && needs.semver-release-type.outputs.release_type || '' }}
      initial_api_contract: false

  migration-readiness:
    name: Offline migration readiness
    needs: validation-plan
    if: needs.validation-plan.outputs.select_migration_readiness == 'true'
    runs-on: ubuntu-24.04
    # The 20-minute catalogue deadline leaves ten minutes for checkout and evidence handling.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check trusted-live smoke and apply profile contracts
        run: python3 scripts/test-migration-readiness.py --coverage-contracts
      - name: Run shared offline tier
        run: >-
          python3 scripts/migration-readiness.py run
          --tier offline
          --revision "${GITHUB_SHA}"
          --evidence target/migration-readiness/evidence-v2.json
      - name: Validate exact-revision evidence
        if: always() && hashFiles('target/migration-readiness/evidence-v2.json') != ''
        run: >-
          python3 scripts/migration-readiness.py validate-evidence
          --evidence target/migration-readiness/evidence-v2.json
          --tier offline
          --revision "${GITHUB_SHA}"
          --require-success
      - name: Upload bounded offline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-readiness-offline-${{ github.sha }}-${{ github.run_id }}
          path: target/migration-readiness/evidence-v2.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  lockfile-release-age:
    name: Lockfile release age
    needs: validation-plan
    if: needs.validation-plan.outputs.select_lockfile_release_age == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve the aggregate result outside pull requests
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: echo 'Lockfile release-age comparisons run for PR and merge queue candidates.'
      - name: Check out the exact pull-request candidate and base history
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          persist-credentials: false
      - name: Check out the shared lockfile policy
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/.github
          # renovate: datasource=github-digest depName=Strukturpiloten/.github currentValue=main
          ref: e362e4564f8e3c1d9d113242e3bf34011f2d7cd7
          path: .github/strukturpiloten-shared
          persist-credentials: false
      - name: Reject newly introduced dependencies younger than three days
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          for revision in "${BASE_SHA}" "${HEAD_SHA}"; do
            [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          done
          if [[ "${GITHUB_EVENT_NAME}" == merge_group ]]; then
            test "${HEAD_SHA}" = "${GITHUB_SHA}"
            git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"
          fi
          python3 .github/strukturpiloten-shared/scripts/lockfile_release_age.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --base "${BASE_SHA}" --head "${HEAD_SHA}" --minimum-age-hours 72
  pr-gate:
    name: Required CI
    if: always()
    needs:
      [
        release-binaries,
        automation,
        canonical-artifact-integrity,
        kubernetes-artifact-integrity,
        compose-provider-integrity,
        validation-plan,
        rust,
        msrv,
        dependencies,
        documentation,
        release-metadata,
        semver-release-type,
        semver,
        coverage,
        migration-readiness,
        lockfile-release-age,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate aggregate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out trusted PR base aggregate verifier
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: .validation-base
          persist-credentials: false
      - name: Require every selected job to succeed and every skip to be planned
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PLAN_JSON: ${{ needs.validation-plan.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          NEEDS_JSON=$(python3 - <<'BINARY_NEEDS_PY'
          import json
          import os
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate needs key")
                  result[key] = value
              return result
          needs = json.loads(os.environ["NEEDS_JSON"], object_pairs_hook=unique_object)
          if not isinstance(needs, dict):
              raise SystemExit("needs must be an object")
          for required in ("release-binaries", "automation", "canonical-artifact-integrity", "kubernetes-artifact-integrity", "compose-provider-integrity"):
              prerequisite = needs.get(required)
              if not isinstance(prerequisite, dict) or prerequisite.get("result") != "success":
                  raise SystemExit(f"{required} must succeed")
              del needs[required]
          print(json.dumps(needs, separators=(",", ":")))
          BINARY_NEEDS_PY
          )
          export NEEDS_JSON
          if [[ "${EVENT_NAME}" == 'merge_group' || ( "${EVENT_NAME}" == 'pull_request' &&
                ( ! -f .validation-base/scripts/validation-plan.py ||
                  ! -f .validation-base/scripts/validation-policy.json ) ) ]]; then
            # Bootstrap has no trusted verifier. Require the literal complete plan and all jobs.
            python3 - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os

          jobs = "rust msrv dependencies documentation release-metadata semver-release-type semver coverage migration-readiness lockfile-release-age".split()
          plan = json.loads(os.environ["PLAN_JSON"])
          needs = json.loads(os.environ["NEEDS_JSON"])
          if (set(plan) != {"schema", "repository", "event", "base_sha", "head_sha", "tested_sha",
                            "profile", "jobs", "reasons", "local_fingerprint"}
                  or plan["schema"] != 2 or plan["repository"] != "Strukturpiloten/boxferry"
                  or plan["event"] != os.environ["EVENT_NAME"] or plan["profile"] != "full"
                  or plan["base_sha"] != os.environ["BASE_SHA"]
                  or plan["head_sha"] != os.environ["HEAD_SHA"]
            or (plan["event"] == "merge_group" and plan["head_sha"] != plan["tested_sha"])
                  or plan["tested_sha"] != os.environ["GITHUB_SHA"]
                  or plan["jobs"] != {job: True for job in jobs}
                  or set(needs) != {"validation-plan", *jobs}):
              raise SystemExit("first-rollout complete validation contract is missing or inconsistent")
          for job in ("validation-plan", *jobs):
              if needs[job].get("result") != "success":
                  raise SystemExit(f"first-rollout required job {job} did not succeed")
          print("First-rollout complete validation: every required job succeeded")
          PY
          else
            verifier=scripts/validation-plan.py
            policy_root=.
            if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
              verifier=.validation-base/scripts/validation-plan.py
              policy_root=.validation-base
            fi
            python3 "${verifier}" gate --policy-root "${policy_root}" \
              --event "${EVENT_NAME}" --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" \
              --tested-sha "${GITHUB_SHA}" \
              --plan-json "${PLAN_JSON}" --needs-json "${NEEDS_JSON}" |
              tee -a "${GITHUB_STEP_SUMMARY}"
          fi
