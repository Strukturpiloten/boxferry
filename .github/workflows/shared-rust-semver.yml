---
name: Shared Rust public API

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact caller revision tested in this run.
        required: true
        type: string
      automation_sha:
        description: Immutable BoxFerry commit; must equal this workflow call's SHA ref.
        required: true
        type: string
      policy_sha:
        description: Trusted PR or merge queue base, otherwise the candidate SHA.
        required: true
        type: string
      config_path:
        description: Repository-relative JSON policy path in the trusted policy revision.
        required: true
        type: string
      package:
        description: One exact workspace crate name.
        required: true
        type: string
      api_purpose:
        description: Published release compatibility by default; development requires a trusted Git baseline.
        default: published
        type: string
      release_type:
        description: Development-only major, minor or patch; published requires empty manifest inference.
        default: ""
        type: string
      initial_api_contract:
        description: Allow canonical crate absence only with the explicit positive initial-api-contract policy task.
        default: false
        type: boolean
    outputs:
      candidate_sha:
        description: Exact candidate whose selected task succeeded.
        value: ${{ jobs.check.outputs.candidate_sha }}
      published_api_candidate_sha:
        description: Exact candidate with published-purpose API success; empty for development.
        value: ${{ jobs.check.outputs.published_api_candidate_sha }}

permissions:
  contents: read

jobs:
  check:
    name: Public API compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate_sha: ${{ steps.result.outputs.candidate_sha }}
      published_api_candidate_sha: ${{ steps.result.outputs.published_api_candidate_sha }}
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      GIT_NO_REPLACE_OBJECTS: "1"
    steps:
      - name: Check out immutable shared automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          ref: ${{ inputs.automation_sha }}
          path: _automation
          persist-credentials: false
      - name: Bind caller candidate and trusted policy
        id: source
        uses: ./_automation/.github/actions/shared-source
        with:
          candidate-sha: ${{ inputs.candidate_sha }}
          automation-sha: ${{ inputs.automation_sha }}
          policy-sha: ${{ inputs.policy_sha }}
          config-path: ${{ inputs.config_path }}
      - name: Install the locked shared Python project
        uses: ./_automation/.github/actions/shared-python
      - name: Select explicit API purpose and trusted baseline
        id: baseline
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          API_PURPOSE: ${{ inputs.api_purpose }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          ALLOW_INITIAL: ${{ inputs.initial_api_contract }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          POLICY_SHA: ${{ inputs.policy_sha }}
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: |
          set -euo pipefail
          initial=()
          if [[ "${ALLOW_INITIAL}" == true ]]; then initial+=(--allow-initial); fi
          uv run --locked --project _automation/automation python -m boxferry_ci.api_baselines prepare \
            --repository-root source --api-purpose "${API_PURPOSE}" --package "${PACKAGE}" \
            --candidate-sha "${CANDIDATE_SHA}" --policy-sha "${POLICY_SHA}" \
            --automation-sha "${AUTOMATION_SHA}" --release-type "${RELEASE_TYPE}" \
            --report-json source/target/api-baseline.json --github-output "${GITHUB_OUTPUT}" "${initial[@]}"
      - name: Require positive initial-API contract
        if: steps.baseline.outputs.kind == 'initial-contract'
        shell: bash
        env:
          POLICY_CONFIG: ${{ steps.source.outputs.config }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: |
          uv run --locked --project _automation/automation python -m boxferry_ci run \
            --repository-root source --config "${POLICY_CONFIG}" --task initial-api-contract \
            --tested-sha "${CANDIDATE_SHA}" --automation-sha "${AUTOMATION_SHA}" \
            --report-json source/target/automation-initial-api-contract.json
      - name: Retain the structured initial-API outcome when exercised
        if: always() && inputs.initial_api_contract && steps.baseline.outputs.kind == 'initial-contract'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: initial-api-${{ inputs.package }}-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: source/target/automation-initial-api-contract.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Install and verify the exact candidate Cargo subcommand
        id: cargo-tool
        shell: bash
        run: |
          uv run --locked --project _automation/automation python -m boxferry_ci.cargo_tools install \
            --repository-root source --package cargo-semver-checks \
            --destination "${RUNNER_TEMP}/boxferry-cargo-tools" \
            --github-output "${GITHUB_OUTPUT}" --github-path "${GITHUB_PATH}" \
            --github-env "${GITHUB_ENV}"
      - name: Check selected public API compatibility
        if: steps.baseline.outputs.kind != 'initial-contract'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: ${{ steps.cargo-tool.outputs.rust_channel }}
          manifest-path: source/Cargo.toml
          package: ${{ inputs.package }}
          feature-group: all-features
          release-type: ${{ steps.baseline.outputs.release_type }}
          baseline-rev: ${{ steps.baseline.outputs.baseline_rev }}
          baseline-version: ${{ steps.baseline.outputs.baseline_version }}
      - name: Expose purpose-bound successful API evidence
        id: result
        shell: bash
        env:
          SELECTION_SHA256: ${{ steps.baseline.outputs.selection_sha256 }}
        run: |
          uv run --locked --project _automation/automation python -m boxferry_ci.api_baselines finish \
            --repository-root source --report-json source/target/api-baseline.json \
            --selection-sha256 "${SELECTION_SHA256}" --github-output "${GITHUB_OUTPUT}"
      - name: Retain API purpose, baseline and actual tool evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-baseline-${{ inputs.package }}-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: source/target/api-baseline.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
