---
name: Reviewed Docker consumer isolated lane

on:
  workflow_call:
    inputs:
      context_only:
        default: false
        type: boolean
      lane:
        required: true
        type: string
      admission_revision:
        required: true
        type: string
      box_pr:
        required: true
        type: string
      box_sha:
        required: true
        type: string
      lens_pr:
        required: true
        type: string
      lens_sha:
        required: true
        type: string
    secrets:
      RELEASE_PLZ_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  BOX_PR: ${{ inputs.box_pr }}
  BOX_SHA: ${{ inputs.box_sha }}
  LENS_PR: ${{ inputs.lens_pr }}
  LENS_SHA: ${{ inputs.lens_sha }}
  LANE: ${{ inputs.lane }}

jobs:
  context-smoke:
    name: Nested worker context only without forwarded stored secrets
    if: inputs.context_only
    uses: ./.github/workflows/reviewed-docker-consumer-worker.yml
    with:
      mode: context
      lane: ${{ inputs.lane }}
      box_pr: ${{ inputs.box_pr }}
      box_sha: ${{ inputs.box_sha }}
      lens_pr: ${{ inputs.lens_pr }}
      lens_sha: ${{ inputs.lens_sha }}

  pre-build:
    name: Fresh admission before candidate build
    if: inputs.context_only == false && github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out independently pinned admission helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ inputs.admission_revision }}
          path: admission
          persist-credentials: false
      - name: Re-admit both heads and actors before privileged prerequisites and revoke
        uses: ./trusted/.github/actions/reviewed-docker-admission
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          admission-revision: ${{ inputs.admission_revision }}
          box-pr: ${{ inputs.box_pr }}
          box-sha: ${{ inputs.box_sha }}
          lens-pr: ${{ inputs.lens_pr }}
          lens-sha: ${{ inputs.lens_sha }}

  build:
    name: Candidate build without forwarded stored secrets
    needs: pre-build
    uses: ./.github/workflows/reviewed-docker-consumer-worker.yml
    with:
      mode: build
      lane: ${{ inputs.lane }}
      box_pr: ${{ inputs.box_pr }}
      box_sha: ${{ inputs.box_sha }}
      lens_pr: ${{ inputs.lens_pr }}
      lens_sha: ${{ inputs.lens_sha }}

  seal:
    name: Fresh data-only sealing and final pre-native admission
    needs: build
    if: github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      binding: ${{ steps.issue.outputs.binding }}
    env:
      BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
    steps:
      - name: Require successful exact build dependency
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
      - name: Check out trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out independently pinned admission helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ inputs.admission_revision }}
          path: admission
          persist-credentials: false
      - name: Check out exact BoxFerry source as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          ref: ${{ inputs.box_sha }}
          path: candidate
          persist-credentials: false
      - name: Check out exact DockerLens source as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ inputs.lens_sha }}
          path: lens-execution
          persist-credentials: false
      - name: Download only direct successful build artifact identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: build-bundle
          merge-multiple: false
          digest-mismatch: error
      - name: Independently inspect closed build bundle without executing it
        run: |
          set -euo pipefail
          python3 trusted/scripts/reviewed-docker-consumer-transfer.py inspect \
            --trusted-root "$PWD/trusted" --box-root "$PWD/candidate" --lens-root "$PWD/lens-execution" \
            --bundle-root "$PWD/build-bundle" --output "$PWD/binding-draft.json" --artifact-id "$BUILD_ARTIFACT_ID" \
            --box-pr "$BOX_PR" --box-sha "$BOX_SHA" --lens-pr "$LENS_PR" --lens-sha "$LENS_SHA" \
            --trusted-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --lane "$LANE"
      - name: Re-admit both exact heads immediately before isolated runtime and revoke
        id: admission
        uses: ./trusted/.github/actions/reviewed-docker-admission
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          admission-revision: ${{ inputs.admission_revision }}
          box-pr: ${{ inputs.box_pr }}
          box-sha: ${{ inputs.box_sha }}
          lens-pr: ${{ inputs.lens_pr }}
          lens-sha: ${{ inputs.lens_sha }}
      - name: Issue short-lived trusted binding only after successful admission and revocation
        id: issue
        env:
          CHECKED_AT: ${{ steps.admission.outputs.checked-at }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/reviewed-docker-consumer-transfer.py issue \
            --trusted-root "$PWD/trusted" --box-root "$PWD/candidate" --lens-root "$PWD/lens-execution" \
            --bundle-root "$PWD/binding-draft.json" --output "$PWD/binding" --artifact-id "$BUILD_ARTIFACT_ID" \
            --box-pr "$BOX_PR" --box-sha "$BOX_SHA" --lens-pr "$LENS_PR" --lens-sha "$LENS_SHA" \
            --trusted-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --lane "$LANE" \
            --checked-at "$CHECKED_AT"
      - name: Upload only trusted binding in its separate namespace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-docker-binding-${{ inputs.lane }}-${{ inputs.box_sha }}-${{ inputs.lens_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binding/binding.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  native:
    name: Isolated native execution after fresh revocation barrier
    needs: [build, seal]
    uses: ./.github/workflows/reviewed-docker-consumer-worker.yml
    with:
      mode: native
      lane: ${{ inputs.lane }}
      box_pr: ${{ inputs.box_pr }}
      box_sha: ${{ inputs.box_sha }}
      lens_pr: ${{ inputs.lens_pr }}
      lens_sha: ${{ inputs.lens_sha }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      binding: ${{ needs.seal.outputs.binding }}
