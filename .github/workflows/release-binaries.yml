---
name: Release binaries

on:
  workflow_call:
    outputs:
      release_binary_artifact:
        description: Verified six-target CLI archives from this revision and run.
        value: ${{ jobs.collect.outputs.release_binary_artifact }}

permissions:
  contents: read

jobs:
  build:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
          - target: i686-unknown-linux-musl
            runs-on: ubuntu-24.04
          - target: armv7-unknown-linux-musleabihf
            runs-on: ubuntu-24.04
          - target: x86_64-apple-darwin
            runs-on: macos-15-intel
          - target: aarch64-apple-darwin
            runs-on: macos-15
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and test release executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          if [[ "${TARGET}" == *-linux-musl* ]]; then
            toolchain_sysroot="$(rustc --print sysroot)"
            toolchain_host="$(rustc -vV | sed -n 's/^host: //p')"
            export RUSTFLAGS='-Clink-self-contained=yes'
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="${toolchain_sysroot}/lib/rustlib/${toolchain_host}/bin/rust-lld"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="${CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER}"
            export CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER="${CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER}"
            export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER="${CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER}"
          fi
          cargo build --locked --release --package boxferry --target "${TARGET}"
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; p=json.load(sys.stdin)["packages"]; print(next(x["version"] for x in p if x["name"]=="boxferry"))')"
          set -- python3 scripts/release-binaries.py package --target "${TARGET}" \
            --binary "target/${TARGET}/release/boxferry" --version "${version}" \
            --revision "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --output "target/release-binaries/${TARGET}"
          emulator_name=''
          case "${TARGET}" in
            i686-unknown-linux-musl) emulator_name=qemu-i386 ;;
            armv7-unknown-linux-musleabihf) emulator_name=qemu-arm ;;
          esac
          if [[ -n "${emulator_name}" ]]; then
            bash scripts/lib/release-emulator.sh docker "${TARGET}" "${RUNNER_TEMP}/release-emulator"
            set -- "$@" --emulator "${RUNNER_TEMP}/release-emulator/${emulator_name}"
          fi
          "$@"
      - name: Upload tested target archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boxferry-cli-${{ github.sha }}-${{ github.run_id }}-${{ matrix.target }}
          path: target/release-binaries/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  collect:
    name: Verify complete CLI archive set
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_binary_artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's target archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: boxferry-cli-${{ github.sha }}-${{ github.run_id }}-*
          path: target/release-binary-inputs
          merge-multiple: false
      - name: Collect and verify exact six-target set
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; p=json.load(sys.stdin)["packages"]; print(next(x["version"] for x in p if x["name"]=="boxferry"))')"
          python3 scripts/release-binaries.py collect --input target/release-binary-inputs \
            --output target/release-binary-set --version "${version}" \
            --revision "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}"
          python3 scripts/release-binaries.py verify-set --input target/release-binary-set \
            --version "${version}" --revision "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}"
          printf 'name=boxferry-cli-%s-%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
      - name: Upload verified CLI archive set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: target/release-binary-set/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
