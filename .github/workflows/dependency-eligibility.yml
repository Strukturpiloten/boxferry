---
name: Dependency eligibility service
on: # zizmor: ignore[dangerous-triggers] -- Trusted listener delegates only immutable shared code; it never executes candidate code.
  workflow_run:
    workflows: [CI]
    types: [requested, completed]
  schedule:
    - cron: "17 * * * *"
permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write
# Reviewed immutable bootstrap infrastructure; no automation release exists yet (ADR 0092).
jobs:
  eligibility:
    name: Trusted dependency metadata
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group'))
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
      statuses: write
    uses: Strukturpiloten/boxferry/.github/workflows/shared-dependency-eligibility.yml@c8dac82382c9cec8f2857e66e4f9e0bc6100dcb1 # automation-v1 interface v1
    with:
      automation-sha: c8dac82382c9cec8f2857e66e4f9e0bc6100dcb1
