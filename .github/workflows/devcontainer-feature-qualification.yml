---
name: Qualify Dev Container feature updates
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
jobs:
  qualify:
    if: >-
      github.repository == 'Strukturpiloten/boxferry' &&
      github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' &&
      github.event_name == 'workflow_dispatch'
    uses: Strukturpiloten/boxferry/.github/workflows/shared-devcontainer-updates.yml@53a2104938e4fcff2a5db8e8920c4bf4ba476ed9 # automation-v1 interface v1
    with:
      automation-sha: 53a2104938e4fcff2a5db8e8920c4bf4ba476ed9
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
