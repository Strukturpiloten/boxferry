---
name: Qualify Dev Container feature updates
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
jobs:
  qualify:
    if: >-
      github.repository == 'Strukturpiloten/boxferry' &&
      github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' &&
      github.event_name == 'workflow_dispatch'
    uses: Strukturpiloten/boxferry/.github/workflows/shared-devcontainer-updates.yml@7b9ce867e0de8b05ee5d084581cad7de54d06459 # automation-v1 interface v1
    with:
      automation-sha: 7b9ce867e0de8b05ee5d084581cad7de54d06459
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
