---
name: Reviewed Docker consumer validation

on:
  workflow_dispatch:
    inputs:
      context_only:
        description: Verify only the real nested hosted caller context; no App credentials or candidate work.
        default: false
        type: boolean
      box_pr:
        description: Open same-repository BoxFerry PR authorized on trusted main.
        required: true
        type: string
      box_sha:
        description: Full authorized current published BoxFerry head.
        required: true
        type: string
      lens_pr:
        description: Open same-repository DockerLens PR authorized on trusted main.
        required: true
        type: string
      lens_sha:
        description: Full authorized current published DockerLens head.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reviewed-docker-consumer-${{ inputs.box_pr }}-${{ inputs.lens_pr }}
  cancel-in-progress: false

env:
  # Reviewed DockerLens #42 merge; unreleased shared CI helper, not a release pin.
  # renovate: datasource=github-digest depName=Strukturpiloten/docker-lens currentValue=main
  ADMISSION_REVISION: c1b79d6af1b29f036b7704efc225fbd648e0b1cc
  BOX_PR: ${{ inputs.box_pr }}
  BOX_SHA: ${{ inputs.box_sha }}
  LENS_PR: ${{ inputs.lens_pr }}
  LENS_SHA: ${{ inputs.lens_sha }}

jobs:
  context-smoke:
    name: Verify real nested caller context without stored secrets
    if: github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reviewed-docker-consumer-lane.yml
    with:
      context_only: true
      lane: upstream-rootless
      admission_revision: ""
      box_pr: ${{ inputs.box_pr }}
      box_sha: ${{ inputs.box_sha }}
      lens_pr: ${{ inputs.lens_pr }}
      lens_sha: ${{ inputs.lens_sha }}

  admission:
    name: Admit both exact reviewed published heads
    needs: context-smoke
    if: inputs.context_only == false && github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      admission_revision: ${{ steps.pin.outputs.revision }}
    steps:
      - name: Check out trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out independently pinned admission helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ env.ADMISSION_REVISION }}
          path: admission
          persist-credentials: false
      - name: Admit manifest pair and immediately revoke token
        uses: ./trusted/.github/actions/reviewed-docker-admission
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          admission-revision: ${{ env.ADMISSION_REVISION }}
          box-pr: ${{ inputs.box_pr }}
          box-sha: ${{ inputs.box_sha }}
          lens-pr: ${{ inputs.lens_pr }}
          lens-sha: ${{ inputs.lens_sha }}
      - name: Pass only the canonical helper revision
        id: pin
        run: echo "revision=$ADMISSION_REVISION" >> "$GITHUB_OUTPUT"

  lanes:
    name: Volume-only native / ${{ matrix.lane }} / inert binds and constraints
    needs: admission
    if: github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [debian11-rootful, debian11-rootless, upstream-rootful, upstream-rootless]
    uses: ./.github/workflows/reviewed-docker-consumer-lane.yml
    with:
      lane: ${{ matrix.lane }}
      admission_revision: ${{ needs.admission.outputs.admission_revision }}
      box_pr: ${{ inputs.box_pr }}
      box_sha: ${{ inputs.box_sha }}
      lens_pr: ${{ inputs.lens_pr }}
      lens_sha: ${{ inputs.lens_sha }}
    secrets:
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

  aggregate:
    name: Fresh trusted Docker consumer result
    needs: [admission, lanes]
    if: always() && !inputs.context_only && github.repository == 'Strukturpiloten/boxferry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Reject failed skipped cancelled or missing lane jobs
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          LANES_RESULT: ${{ needs.lanes.result }}
        run: |
          set -euo pipefail
          test "$ADMISSION_RESULT" = success
          test "$LANES_RESULT" = success
      - name: Check out trusted dispatcher anew
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out independently pinned admission helper anew
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ env.ADMISSION_REVISION }}
          path: admission
          persist-credentials: false
      - name: Check out exact BoxFerry inputs for independent data-only validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          ref: ${{ inputs.box_sha }}
          path: candidate
          persist-credentials: false
      - name: Reconstruct fresh real clean exact Lens dependency tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/docker-lens
          ref: ${{ inputs.lens_sha }}
          path: lens-execution
          persist-credentials: false
      - name: Download only current-pair current-attempt sanitized lane artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reviewed-docker-consumer-*-${{ inputs.box_sha }}-${{ inputs.lens_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          merge-multiple: false
          digest-mismatch: error
      - name: Download only current-pair current-attempt trusted build bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reviewed-docker-binding-*-${{ inputs.box_sha }}-${{ inputs.lens_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bindings
          merge-multiple: false
          digest-mismatch: error
      - name: Independently reconstruct approved verifier and require all four complete bound lanes
        run: |
          set -euo pipefail
          python3 trusted/scripts/reviewed-docker-consumer-evidence.py \
            --trusted-root "$PWD/trusted" --box-root "$PWD/candidate" --lens-root "$PWD/lens-execution" \
            --verifier-root "$PWD/verifier" --artifacts "$PWD/artifacts" --bindings "$PWD/bindings" \
            --box-pr "$BOX_PR" --box-sha "$BOX_SHA" --lens-pr "$LENS_PR" --lens-sha "$LENS_SHA" \
            --trusted-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Freshly re-admit both exact heads and both actors and revoke
        uses: ./trusted/.github/actions/reviewed-docker-admission
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          admission-revision: ${{ env.ADMISSION_REVISION }}
          box-pr: ${{ inputs.box_pr }}
          box-sha: ${{ inputs.box_sha }}
          lens-pr: ${{ inputs.lens_pr }}
          lens-sha: ${{ inputs.lens_sha }}
