---
name: Shared Rust CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact caller revision tested in this run.
        required: true
        type: string
      automation_sha:
        description: Immutable BoxFerry commit; must equal this workflow call's SHA ref.
        required: true
        type: string
      policy_sha:
        description: Trusted PR or merge queue base, otherwise the candidate SHA.
        required: true
        type: string
      config_path:
        description: Repository-relative JSON policy path in the trusted policy revision.
        required: true
        type: string
      task:
        description: One of rust-quality, msrv, coverage, release-metadata, release-metadata-strict.
        required: true
        type: string
    outputs:
      candidate_sha:
        description: Exact candidate whose selected task succeeded.
        value: ${{ jobs.check.outputs.candidate_sha }}

permissions:
  contents: read

jobs:
  check:
    name: Shared Rust task
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      candidate_sha: ${{ steps.result.outputs.candidate_sha }}
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out immutable shared automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          ref: ${{ inputs.automation_sha }}
          path: _automation
          persist-credentials: false
      - name: Bind caller candidate and trusted policy
        id: source
        uses: ./_automation/.github/actions/shared-source
        with:
          candidate-sha: ${{ inputs.candidate_sha }}
          automation-sha: ${{ inputs.automation_sha }}
          policy-sha: ${{ inputs.policy_sha }}
          config-path: ${{ inputs.config_path }}
      - name: Install the locked shared Python project
        uses: ./_automation/.github/actions/shared-python
      - name: Select the configured Rust toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Derive the common workspace minimum Rust version
        if: inputs.task == 'msrv'
        id: msrv
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, re, sys; versions = {p.get("rust_version") for p in json.load(sys.stdin)["packages"]}; assert len(versions) == 1; version = versions.pop(); assert isinstance(version, str) and re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", version); print(version)')"
          printf 'version=%s\n' "${msrv}" >> "${GITHUB_OUTPUT}"
      - name: Install the exact workspace minimum Rust toolchain
        if: inputs.task == 'msrv'
        env:
          RUST_MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "${RUST_MSRV}" --profile minimal --no-self-update
      - name: Install LLVM coverage component
        if: inputs.task == 'coverage'
        working-directory: source
        run: rustup component add llvm-tools-preview
      - name: Install canonical coverage tool
        if: inputs.task == 'coverage'
        working-directory: source
        # renovate: datasource=crate depName=cargo-llvm-cov
        run: cargo install --locked --version 0.9.0 cargo-llvm-cov
      - name: Run the bounded repository task
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          POLICY_CONFIG: ${{ steps.source.outputs.config }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
          RUST_MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          case "${TASK}" in
            rust-quality|msrv|coverage|release-metadata|release-metadata-strict) ;;
            *) echo 'Unsupported shared Rust task.' >&2; exit 1 ;;
          esac
          if [[ "${TASK}" == msrv ]]; then export RUSTUP_TOOLCHAIN="${RUST_MSRV}"; fi
          uv run --locked --project _automation/automation python -m boxferry_ci run \
            --repository-root source --config "${POLICY_CONFIG}" --task "${TASK}" \
            --tested-sha "${CANDIDATE_SHA}" --automation-sha "${AUTOMATION_SHA}" \
            --report-json source/target/automation-task-report.json
      - name: Retain the structured task outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-${{ inputs.task }}-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: source/target/automation-task-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Expose successful candidate binding
        id: result
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: printf 'candidate_sha=%s\n' "${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
