[workspace]
members = [
    "crates/boxferry",
    "crates/boxferry-engine",
    "crates/boxferry-model",
]
default-members = ["crates/boxferry"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MPL-2.0"
homepage = "https://www.strukturpiloten.de/"
repository = "https://github.com/Strukturpiloten/boxferry"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
