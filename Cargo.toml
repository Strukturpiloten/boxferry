[workspace]
resolver = "3"
members = [
  "crates/boxferry",
  "crates/boxferry-compose",
  "crates/boxferry-engine",
  "crates/boxferry-model",
  "crates/boxferry-podman",
  "crates/boxferry-quadlet",
]
default-members = ["crates/boxferry"]

[workspace.package]
version = "0.8.3"
edition = "2024"
rust-version = "1.85.0"
homepage = "https://boxferry.dev/"
repository = "https://github.com/Strukturpiloten/boxferry"
license = "MPL-2.0"
keywords = ["containers", "docker-compose", "migration", "podman", "quadlet"]
categories = ["command-line-utilities", "config", "development-tools"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.metadata.strukturpiloten]
company = "Strukturpiloten OHG"
github = "https://github.com/TheRealBecks"
maintainer = 'Martin "Becks" Beckert'
website = "https://www.strukturpiloten.de/"
